<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tamam Research Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script async src="https://www.instagram.com/embed.js"></script>
<style>
:root {
  color-scheme: light dark;
  --bg-gradient: linear-gradient(135deg, rgba(236,242,255,1), rgba(221,229,255,0.6));
  --fg-color: #0f172a;
  --subtle: rgba(15,23,42,0.6);
  --card-bg: rgba(255,255,255,0.72);
  --card-border: rgba(255,255,255,0.35);
  --accent: #5a5df0;
  --accent-soft: rgba(90,93,240,0.15);
  --shadow: 0 24px 60px rgba(15,23,42,0.12);
  --ring: 0 0 0 3px rgba(90,93,240,0.3);
}
[data-theme="dark"] {
  --bg-gradient: linear-gradient(140deg, rgba(18,26,53,1), rgba(46,30,70,0.8));
  --fg-color: #f8fafc;
  --subtle: rgba(241,245,249,0.7);
  --card-bg: rgba(15,23,42,0.68);
  --card-border: rgba(255,255,255,0.08);
  --accent: #8e9bff;
  --accent-soft: rgba(142,155,255,0.12);
  --shadow: 0 24px 60px rgba(0,0,0,0.35);
  --ring: 0 0 0 3px rgba(142,155,255,0.3);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg-gradient);
  color: var(--fg-color);
  min-height: 100vh;
  transition: background 0.6s ease, color 0.3s ease;
}
body, html {
  scroll-behavior: smooth;
}
a {
  color: inherit;
}
button, input, select, textarea {
  font: inherit;
  color: inherit;
}
.glass-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
  border-radius: 20px;
}
header.top-bar {
  position: sticky;
  top: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px clamp(16px, 4vw, 48px);
  background: color-mix(in srgb, transparent 60%, var(--card-bg));
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.2);
}
header.top-bar .brand {
  display: flex;
  gap: 14px;
  align-items: center;
}
.logo-circle {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, #5a5df0, #9d8cff);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
  font-size: 20px;
}
@media (max-width: 600px) {
  .logo-circle { width: 32px; height: 32px; font-size: 16px; }
}
header.top-bar nav {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
header.top-bar nav a {
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 500;
  transition: transform 0.2s ease, background 0.2s ease;
}
header.top-bar nav a.active {
  background: var(--accent);
  color: #fff;
}
header.top-bar nav a:hover {
  transform: translateY(-2px);
}
.controls {
  display: flex;
  align-items: center;
  gap: 10px;
}
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.icon-btn:focus-visible {
  outline: none;
  box-shadow: var(--ring);
}
.icon-btn:hover {
  transform: translateY(-1px);
}
.language-toggle {
  border-radius: 999px;
  padding: 8px 16px;
  font-weight: 600;
}
main#app {
  padding: 32px clamp(16px, 4vw, 64px) 120px;
}
.page {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 32px;
}
.hero-card {
  padding: 32px;
  display: grid;
  gap: 16px;
}
.hero-card p {
  margin: 0;
  line-height: 1.6;
}
.carousel {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding-bottom: 16px;
  -webkit-overflow-scrolling: touch;
}
.carousel::-webkit-scrollbar {
  height: 6px;
}
.carousel::-webkit-scrollbar-thumb {
  background: var(--accent-soft);
  border-radius: 999px;
}
.ig-card {
  flex: 0 0 280px;
  scroll-snap-align: start;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  background: rgba(15,23,42,0.08);
}
.ig-embed, .ig-fallback {
  width: 100%;
  aspect-ratio: 9 / 16;
}
.ig-embed blockquote {
  margin: 0 !important;
  width: 100% !important;
}
.ig-fallback {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  gap: 16px;
  background: rgba(255,255,255,0.6);
}
[data-theme="dark"] .ig-fallback {
  background: rgba(15,23,42,0.6);
}
.ig-fallback svg {
  width: 48px;
  height: 48px;
  opacity: 0.7;
}
.ig-fallback button {
  border-radius: 999px;
  padding: 10px 18px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-weight: 600;
  cursor: pointer;
}
.social-card {
  padding: 28px;
  display: grid;
  gap: 24px;
}
.social-grid {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
}
.social-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 16px;
  background: rgba(255,255,255,0.4);
  border: 1px solid rgba(255,255,255,0.5);
  text-decoration: none;
  font-weight: 600;
  justify-content: center;
}
[data-theme="dark"] .social-link {
  background: rgba(15,23,42,0.5);
  border-color: rgba(255,255,255,0.12);
}
.play-badges {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.play-badges img {
  height: 44px;
  width: auto;
  object-fit: contain;
}
form.survey-form {
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.section-card {
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.form-field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.form-field label {
  font-weight: 600;
}
.form-field input, .form-field select, .form-field textarea {
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid rgba(15,23,42,0.2);
  background: rgba(255,255,255,0.65);
}
[data-theme="dark"] .form-field input,
[data-theme="dark"] .form-field select,
[data-theme="dark"] .form-field textarea {
  background: rgba(15,23,42,0.6);
  border-color: rgba(255,255,255,0.12);
}
.form-field input:focus-visible,
.form-field select:focus-visible,
.form-field textarea:focus-visible {
  outline: none;
  box-shadow: var(--ring);
}
.option-group {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.option-chip {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  border-radius: 14px;
  background: rgba(255,255,255,0.55);
  border: 1px solid rgba(15,23,42,0.15);
}
[data-theme="dark"] .option-chip {
  background: rgba(15,23,42,0.55);
  border-color: rgba(255,255,255,0.1);
}
.option-chip input {
  accent-color: var(--accent);
}
.progress-wrap {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.progress-bar {
  height: 10px;
  background: rgba(15,23,42,0.1);
  border-radius: 999px;
  overflow: hidden;
}
.progress-bar span {
  display: block;
  height: 100%;
  background: var(--accent);
  width: 0;
  transition: width 0.3s ease;
}
.helper-banner {
  position: sticky;
  top: 96px;
  padding: 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(90,93,240,0.12), rgba(157,140,255,0.18));
  border: 1px solid rgba(90,93,240,0.25);
  box-shadow: 0 12px 30px rgba(90,93,240,0.25);
  display: none;
  z-index: 5;
}
.helper-banner.active {
  display: block;
}
.commission-list {
  background: rgba(90,93,240,0.12);
  border: 1px solid rgba(90,93,240,0.35);
  border-radius: 16px;
  padding: 18px;
  line-height: 1.6;
}
.commission-list ul {
  margin: 8px 0 0 16px;
  padding: 0;
}
.submit-btn {
  align-self: flex-start;
  border: none;
  border-radius: 16px;
  padding: 14px 28px;
  font-weight: 600;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 18px 36px rgba(90,93,240,0.35);
}
.submit-btn:focus-visible {
  outline: none;
  box-shadow: var(--ring);
}
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 2000;
}
.toast {
  padding: 14px 20px;
  border-radius: 16px;
  background: rgba(15,23,42,0.85);
  color: white;
  font-weight: 500;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
[data-theme="dark"] .toast {
  background: rgba(255,255,255,0.9);
  color: #0f172a;
}
.invalid-hint {
  color: #e11d48;
  font-size: 0.875rem;
}
.invalid-field input,
.invalid-field select,
.invalid-field textarea {
  border-color: #e11d48 !important;
}
[data-dir="rtl"] {
  direction: rtl;
}
[data-dir="rtl"] input[type="email"],
[data-dir="rtl"] input[type="tel"],
[data-dir="rtl"] input[type="number"],
[data-dir="rtl"] .ltr-only {
  direction: ltr;
}
.thanks-card {
  padding: 40px;
  text-align: center;
}
.tabs {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.tabs button {
  border: none;
  border-radius: 16px;
  padding: 10px 18px;
  background: rgba(255,255,255,0.45);
  cursor: pointer;
  font-weight: 600;
}
[data-theme="dark"] .tabs button {
  background: rgba(15,23,42,0.5);
}
.tabs button.active {
  background: var(--accent);
  color: #fff;
}
.stats-grid {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
}
.stat-card {
  padding: 20px;
  border-radius: 18px;
  background: rgba(255,255,255,0.5);
  border: 1px solid rgba(15,23,42,0.08);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
[data-theme="dark"] .stat-card {
  background: rgba(15,23,42,0.55);
  border-color: rgba(255,255,255,0.1);
}
.chart-grid {
  display: grid;
  gap: 24px;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}
.open-text-section {
  display: grid;
  gap: 12px;
}
.text-item {
  padding: 12px 16px;
  border-radius: 16px;
  background: rgba(255,255,255,0.55);
  border: 1px solid rgba(15,23,42,0.12);
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
}
[data-theme="dark"] .text-item {
  background: rgba(15,23,42,0.55);
  border-color: rgba(255,255,255,0.1);
}
.copy-btn {
  border: none;
  border-radius: 12px;
  padding: 6px 12px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}
.table-wrap {
  overflow-x: auto;
  border-radius: 18px;
}
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 720px;
}
th, td {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(15,23,42,0.1);
  text-align: left;
}
[data-theme="dark"] th,
[data-theme="dark"] td {
  border-color: rgba(255,255,255,0.08);
}
.table-controls {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.search-input {
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid rgba(15,23,42,0.2);
}
.sort-btn {
  border: none;
  border-radius: 12px;
  padding: 8px 14px;
  background: rgba(255,255,255,0.5);
  cursor: pointer;
}
[data-theme="dark"] .sort-btn {
  background: rgba(15,23,42,0.5);
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 3000;
}
.modal {
  background: var(--card-bg);
  border-radius: 24px;
  padding: 28px;
  max-width: min(640px, 90vw);
  max-height: 80vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.modal h3 { margin: 0; }
.close-btn {
  align-self: flex-end;
  border: none;
  background: transparent;
  color: var(--fg-color);
  font-size: 20px;
  cursor: pointer;
}
.results-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.action-btn {
  border: none;
  border-radius: 14px;
  padding: 10px 16px;
  font-weight: 600;
  cursor: pointer;
  background: rgba(255,255,255,0.65);
}
[data-theme="dark"] .action-btn {
  background: rgba(15,23,42,0.55);
}
.empty-state {
  padding: 32px;
  text-align: center;
  border-radius: 18px;
  background: rgba(255,255,255,0.5);
}
[data-theme="dark"] .empty-state {
  background: rgba(15,23,42,0.45);
}
</style>
</head>

function applyLanguage() {
  document.documentElement.lang = currentLanguage === 'en' ? 'en' : 'ar';
  const dir = currentLanguage === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.setAttribute('data-dir', dir);
  document.body.setAttribute('data-dir', dir);
  document.documentElement.dir = dir;
  document.body.dir = dir;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (!key) return;
    const val = t(key);
    if (val !== undefined) {
      el.textContent = val;
    }
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    const val = t(key);
    if (val !== undefined) {
      el.setAttribute('placeholder', val);
    }
  });
  document.getElementById('langToggle').querySelector('span').textContent = t('langToggle');
  rebuildCharts();
  if (currentRoute && currentRoute.remount) {
    currentRoute.remount();
  } else if (currentRoute && currentRoute.mount) {
    currentRoute.mount(true);
  }
}

const ROUTES = {};

function ensureRoute(route) {
  if (!ROUTES[route]) throw new Error('Route not found');
}

function navigate(hash, force = false) {
  if (!hash.startsWith('#/')) hash = '#/surveys';
  const parts = hash.replace('#/', '').split('/');
  const key = parts.join('/');
  ensureRoute(key);
  const route = ROUTES[key];
  if (route.guard && !route.guard()) {
    if (DEBUG) console.log('Guard blocked route', key);
    location.hash = '#/surveys';
    return;
  }
  if (!force && currentRoute === route) {
    route.mount(true);
    return;
  }
  if (currentRoute && currentRoute.unmount) {
    if (DEBUG) console.log('Unmount', currentRoute.key);
    currentRoute.unmount();
  }
  currentRoute = route;
  if (DEBUG) console.log('Mount', route.key);
  route.mount();
  document.querySelectorAll('[data-route-link]').forEach(link => {
    const isActive = link.getAttribute('href') === hash;
    link.classList.toggle('active', isActive);
  });
}

function initRouter() {
  if (routerInitialized) return;
  window.addEventListener('hashchange', () => navigate(location.hash));
  routerInitialized = true;
  navigate(location.hash || '#/surveys', true);
}

function dependencySatisfied(form, depends) {
  if (!depends) return true;
  const target = form.querySelector(`[name="${depends.key}"]`);
  if (!target) return true;
  if (target.type === 'radio') {
    const selected = form.querySelector(`input[name="${depends.key}"]:checked`);
    return selected?.value === depends.value;
  }
  if (target.type === 'select-one') {
    return target.value === depends.value;
  }
  if (target.type === 'checkbox') {
    return target.checked === depends.value;
  }
  const values = Array.from(form.querySelectorAll(`input[name="${depends.key}"]:checked`)).map(el => el.value);
  return values.includes(depends.value);
}

function isQuestionVisible(form, item) {
  if (item.dependsOn && !dependencySatisfied(form, item.dependsOn)) return false;
  if (!item.otherFor) return true;
  const parent = item.otherFor;
  const parentField = form.querySelector(`[name="${parent}"]`);
  if (!parentField) return false;
  if (parentField.type === 'select-one') {
    return parentField.value === 'other';
  }
  if (parentField.type === 'radio') {
    const selected = form.querySelector(`input[name="${parent}"]:checked`);
    return selected?.value === 'other';
  }
  if (parentField.type === 'checkbox') {
    return parentField.checked;
  }
  const multi = form.querySelectorAll(`input[name="${parent}"]:checked`);
  return Array.from(multi).some(el => el.value === 'other');
}

function isAnswered(form, item) {
  if (!item.required) return true;
  const field = form.querySelector(`[name="${item.key}"]`);
  if (!field) return false;
  if (item.type === 'checkbox-group') {
    const selected = Array.from(form.querySelectorAll(`input[name="${item.key}"]:checked`));
    return selected.length > 0;
  }
  if (field.type === 'radio') {
    return !!form.querySelector(`input[name="${item.key}"]:checked`);
  }
  if (field.type === 'checkbox') {
    return field.checked;
  }
  return field.value.trim() !== '';
}

function updateProgress(form, config, node) {
  const visibleRequired = config.filter(item => item.required && isQuestionVisible(form, item));
  const answered = visibleRequired.filter(item => isAnswered(form, item)).length;
  const pct = visibleRequired.length === 0 ? 0 : Math.round((answered / visibleRequired.length) * 100);
  node.querySelector('.progress-bar span').style.width = `${pct}%`;
  node.querySelector('[data-progress-label]').textContent = t('progressLabel')(answered, visibleRequired.length);
}

function showValidation(element, message) {
  const container = element.closest('.form-field') || element.parentElement;
  if (!container) return;
  let hint = container.querySelector('.invalid-hint');
  if (!hint) {
    hint = document.createElement('div');
    hint.className = 'invalid-hint';
    container.appendChild(hint);
  }
  hint.textContent = message;
  container.classList.add('invalid-field');
}

function clearValidation(form) {
  form.querySelectorAll('.invalid-hint').forEach(el => el.remove());
  form.querySelectorAll('.invalid-field').forEach(el => el.classList.remove('invalid-field'));
}

function collectFormData(form, config) {
  const data = {};
  config.forEach(item => {
    const field = form.querySelector(`[name="${item.key}"]`);
    if (!field) return;
    if (item.type === 'checkbox-group') {
      const selected = Array.from(form.querySelectorAll(`input[name="${item.key}"]:checked`)).map(input => input.value);
      data[item.key] = selected;
    } else if (field.type === 'radio') {
      const selected = form.querySelector(`input[name="${item.key}"]:checked`);
      data[item.key] = selected ? selected.value : '';
    } else if (field.type === 'checkbox') {
      data[item.key] = field.checked;
    } else {
      data[item.key] = field.value.trim();
    }
  });
  return data;
}

function restoreFormData(form, config, values) {
  config.forEach(item => {
    const field = form.querySelector(`[name="${item.key}"]`);
    if (!field || values[item.key] === undefined) return;
    const value = values[item.key];
    if (item.type === 'checkbox-group' && Array.isArray(value)) {
      Array.from(form.querySelectorAll(`input[name="${item.key}"]`)).forEach(input => {
        input.checked = value.includes(input.value);
      });
    } else if (field.type === 'radio') {
      const option = form.querySelector(`input[name="${item.key}"][value="${value}"]`);
      if (option) option.checked = true;
    } else if (field.type === 'checkbox') {
      field.checked = !!value;
    } else {
      field.value = value;
    }
  });
}

function attachOtherHandlers(form, config, extendedConfig, progressEl) {
  config.filter(item => item.otherKey).forEach(item => {
    const otherField = form.querySelector(`[name="${item.otherKey}"]`);
    const container = otherField?.closest('[data-other-container]');
    const update = () => {
      const visible = isOtherSelected(form, item);
      if (container) container.style.display = visible ? 'flex' : 'none';
      if (!visible) {
        otherField.value = '';
      }
      if (progressEl) {
        updateProgress(form, extendedConfig, progressEl);
      }
    };
    const inputs = form.querySelectorAll(`input[name="${item.key}"]`);
    inputs.forEach(input => input.addEventListener('change', update, { passive: true }));
    const select = form.querySelector(`select[name="${item.key}"]`);
    if (select) select.addEventListener('change', update);
    update();
  });
}

function isOtherSelected(form, item) {
  if (item.type === 'checkbox-group') {
    return Array.from(form.querySelectorAll(`input[name="${item.key}"]:checked`)).some(el => el.value === 'other');
  }
  if (item.type === 'radio') {
    const selected = form.querySelector(`input[name="${item.key}"]:checked`);
    return selected?.value === 'other';
  }
  const select = form.querySelector(`select[name="${item.key}"]`);
  return select?.value === 'other';
}

function optionLabel(opt) {
  if (typeof opt.label === 'string') {
    return t(opt.label);
  }
  if (typeof opt.label === 'object') {
    return opt.label[currentLanguage] ?? opt.label.en ?? opt.label.ar ?? '';
  }
  return String(opt.label ?? '');
}

function buildField(item) {
  const field = document.createElement('div');
  field.className = 'form-field';
  field.dataset.fieldKey = item.key;
  if (item.otherFor) {
    field.dataset.otherContainer = '1';
  }
  const labelKey = item.label;
  const labelText = item.otherFor ? t('multiSelectOtherPlaceholder') : t(labelKey);
  const requiredMark = item.required ? ' *' : '';
  if (!item.otherFor) {
    const label = document.createElement('label');
    label.setAttribute('for', item.key);
    label.textContent = `${labelText}${requiredMark}`;
    field.appendChild(label);
  } else {
    const label = document.createElement('label');
    label.textContent = `${labelText}${requiredMark}`;
    field.appendChild(label);
  }
  if (item.type === 'text' || item.type === 'number' || item.type === 'email' || item.type === 'tel') {
    const input = document.createElement('input');
    input.type = item.type === 'text' ? 'text' : item.type;
    input.name = item.key;
    input.id = item.key;
    if (item.type !== 'text') input.classList.add('ltr-only');
    if (item.min !== undefined) input.min = item.min;
    if (item.step !== undefined) input.step = item.step;
    field.appendChild(input);
  } else if (item.type === 'textarea') {
    const textarea = document.createElement('textarea');
    textarea.name = item.key;
    textarea.id = item.key;
    textarea.rows = item.rows || 4;
    field.appendChild(textarea);
  } else if (item.type === 'select') {
    const select = document.createElement('select');
    select.name = item.key;
    select.id = item.key;
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.hidden = true;
    placeholder.textContent = '--';
    select.appendChild(placeholder);
    item.options.forEach(opt => {
      const option = document.createElement('option');
      option.value = opt.value;
      option.textContent = optionLabel(opt);
      select.appendChild(option);
    });
    field.appendChild(select);
  } else if (item.type === 'radio') {
    const group = document.createElement('div');
    group.className = 'option-group';
    item.options.forEach(opt => {
      const label = document.createElement('label');
      label.className = 'option-chip';
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = item.key;
      input.value = opt.value;
      label.appendChild(input);
      label.append(` ${optionLabel(opt)}`);
      group.appendChild(label);
    });
    field.appendChild(group);
  } else if (item.type === 'checkbox-group') {
    const group = document.createElement('div');
    group.className = 'option-group';
    group.dataset.multi = 'true';
    item.options.forEach(opt => {
      const label = document.createElement('label');
      label.className = 'option-chip';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.name = item.key;
      input.value = opt.value;
      label.appendChild(input);
      label.append(` ${optionLabel(opt)}`);
      group.appendChild(label);
    });
    field.appendChild(group);
  }
  if (item.otherKey) {
    const otherField = document.createElement('div');
    otherField.className = 'form-field';
    otherField.dataset.otherContainer = '1';
    otherField.style.display = 'none';
    const label = document.createElement('label');
    label.textContent = `${t('multiSelectOtherPlaceholder')} *`;
    const input = document.createElement('input');
    input.type = 'text';
    input.name = item.otherKey;
    otherField.appendChild(label);
    otherField.appendChild(input);
    field.appendChild(otherField);
  }
  return field;
}

function createSurveyRoute(key, kind, config, options = {}) {
  const extendedConfig = expandConfig(config);
  const routeKey = `surveys/${key}`;
  const state = { lastValues: null, timerStart: null, elapsedOffset: 0, form: null };
  const route = {
    key: routeKey,
    guard: options.password ? () => requirePassword(options.password) : null,
    mount(preserve = false) {
      const completed = localStorage.getItem(STORAGE_KEYS.completed[kind]) === 'true';
      const app = document.getElementById('app');
      if (preserve && state.form) {
        state.lastValues = collectFormData(state.form, extendedConfig);
      }
      app.innerHTML = '';
      if (!preserve) state.elapsedOffset = 0;
      if (preserve && state.timerStart) {
        state.elapsedOffset += performance.now() - state.timerStart;
      }
      const page = document.createElement('div');
      page.className = 'page';

      const card = document.createElement('section');
      card.className = 'section-card glass-card';
      const heading = document.createElement('h1');
      heading.textContent = t(options.headingKey || 'headerTitle');
      card.appendChild(heading);

      if (completed) {
        const message = document.createElement('div');
        message.className = 'empty-state';
        message.textContent = t('toastDuplicate');
        card.appendChild(message);
        page.appendChild(card);
        app.appendChild(page);
        toast(t('toastDuplicate'));
        return;
      }

      const description = document.createElement('p');
      description.textContent = options.description ? t(options.description) : '';
      if (description.textContent) card.appendChild(description);

      const form = document.createElement('form');
      form.className = 'survey-form';
      const progress = createProgressBar();
      form.appendChild(progress);

      if (kind === 'vendor') {
        const commissionList = document.createElement('div');
        commissionList.className = 'commission-list';
        commissionList.innerHTML = `<strong>${t('commissionIntro')}</strong><ul><li>${t('commissionHome')}</li><li>${t('commissionCar')}</li><li>${t('commissionHealth')}</li><li>${t('commissionLifestyle')}</li></ul>`;
        form.appendChild(commissionList);
        const commissionBlock = document.createElement('div');
        commissionBlock.className = 'helper-banner';
        commissionBlock.innerHTML = `<strong>${t('vendorBannerTitle')}</strong><div data-commission-text></div><small>${t('vendorBannerHelper')}</small>`;
        form.appendChild(commissionBlock);
      }

      config.forEach(item => {
        const field = buildField(item);
        field.dataset.fieldKey = item.key;
        form.appendChild(field);
      });

      if (kind === 'vendor') {
        const helperText = document.createElement('div');
        helperText.style.fontWeight = '600';
        helperText.style.marginTop = '8px';
        helperText.textContent = t('commissionHelper');
        const refField = form.querySelector('[data-field-key="accept_5_10k"]');
        if (refField) refField.before(helperText);
      }

      const submit = document.createElement('button');
      submit.type = 'submit';
      submit.className = 'submit-btn';
      submit.textContent = t('submit');
      form.appendChild(submit);

      card.appendChild(form);
      page.appendChild(card);
      app.appendChild(page);

      attachOtherHandlers(form, config, extendedConfig, progress);

      function handleDependencies() {
        config.forEach(item => {
          if (!item.dependsOn) return;
          const container = form.querySelector(`[data-field-key="${item.key}"]`);
          if (!container) return;
          const visible = dependencySatisfied(form, item.dependsOn);
          container.style.display = visible ? 'flex' : 'none';
          if (!visible) {
            clearFieldValue(form, item);
          }
        });
      }

      handleDependencies();

      const dependencySources = new Set(config.filter(item => item.dependsOn).map(item => item.dependsOn.key));
      dependencySources.forEach(depKey => {
        form.querySelectorAll(`[name="${depKey}"]`).forEach(input => {
          input.addEventListener('change', () => {
            handleDependencies();
            updateProgress(form, extendedConfig, progress);
          });
        });
      });

      const draftRaw = !preserve ? localStorage.getItem(STORAGE_KEYS.drafts[kind]) : null;
      if (preserve && state.lastValues) {
        restoreFormData(form, extendedConfig, state.lastValues);
      } else if (draftRaw) {
        try {
          const draft = JSON.parse(draftRaw);
          restoreFormData(form, extendedConfig, draft);
          toast(t('toastDraftRestored'));
          if (DEBUG) console.log('Draft restored for', kind);
        } catch (err) {
          console.error(err);
        }
      }

      handleDependencies();
      updateProgress(form, extendedConfig, progress);
      state.timerStart = performance.now();
      state.form = form;

      function autosave() {
        const data = collectFormData(form, extendedConfig);
        state.lastValues = data;
        localStorage.setItem(STORAGE_KEYS.drafts[kind], JSON.stringify(data));
        updateProgress(form, extendedConfig, progress);
      }

      form.addEventListener('input', autosave);
      form.addEventListener('change', autosave);

      if (kind === 'vendor') {
        const commissionBlock = form.querySelector('.helper-banner');
        const categorySelect = form.querySelector('[name="category"]');
        const textNode = commissionBlock?.querySelector('[data-commission-text]');
        const updateBanner = () => {
          const value = categorySelect.value;
          if (value) {
            textNode.textContent = t('vendorBannerBody')(value);
            commissionBlock.classList.add('active');
          } else {
            textNode.textContent = '';
            commissionBlock.classList.remove('active');
          }
        };
        categorySelect.addEventListener('change', () => {
          updateBanner();
          updateProgress(form, extendedConfig, progress);
        });
        updateBanner();
      }

      form.addEventListener('submit', evt => {
        evt.preventDefault();
        clearValidation(form);
        const invalid = [];
        extendedConfig.forEach(item => {
          if (!item.required) return;
          if (!isQuestionVisible(form, item)) return;
          const field = form.querySelector(`[name="${item.key}"]`);
          if (!field) return;
          if (item.type === 'checkbox-group') {
            const selected = Array.from(form.querySelectorAll(`input[name="${item.key}"]:checked`));
            if (selected.length === 0) {
              invalid.push(field);
              showValidation(field.closest('.form-field'), t('validationRequired'));
            }
          } else if (field.type === 'radio') {
            const selected = form.querySelector(`input[name="${item.key}"]:checked`);
            if (!selected) {
              invalid.push(field);
              showValidation(field.closest('.form-field'), t('validationRequired'));
            }
          } else {
            if (field.value.trim() === '') {
              invalid.push(field);
              showValidation(field, t('validationRequired'));
            }
          }
        });
        if (invalid.length > 0) {
          const first = invalid[0];
          if (first) first.focus();
          return;
        }
        const seconds = Math.round(((performance.now() - state.timerStart) + state.elapsedOffset) / 1000);
        const payload = collectFormData(form, extendedConfig);
        payload.ts = new Date().toISOString();
        payload.seconds = seconds;
        const db = getDB();
        db[kind].push(payload);
        saveDB(db);
        if (window.TAMAM_BACKEND === 'netlifyForms') {
          postToNetlify(kind, payload);
        }
        localStorage.removeItem(STORAGE_KEYS.drafts[kind]);
        localStorage.setItem(STORAGE_KEYS.completed[kind], 'true');
        state.elapsedOffset = 0;
        state.timerStart = null;
        document.dispatchEvent(new CustomEvent('tamam:dataUpdated', { detail: { kind } }));
        toast(t('toastSubmitted'));
        if (DEBUG) console.log('Submission stored for', kind, payload);
        location.hash = '#/surveys/thanks';
      });
    },
    unmount() {
      if (state.form) {
        state.lastValues = collectFormData(state.form, extendedConfig);
      }
      if (state.timerStart) {
        state.elapsedOffset += performance.now() - state.timerStart;
      }
      state.form = null;
      state.timerStart = null;
    },
    refresh() {
      this.mount(true);
    }
  };
  return route;
}

function formatValue(value) {
  if (Array.isArray(value)) {
    return value.filter(Boolean).join(', ');
  }
  if (value === undefined || value === null) return '';
  return String(value);
}

function fieldLabel(kind, key) {
  if (key === 'seconds') return t('secondsLabel');
  if (key === 'ts') return t('timestampLabel');
  const settings = resultsSettings[kind];
  if (!settings) return t(key) || key;
  const direct = settings.config.find(item => item.key === key);
  if (direct) return t(direct.label);
  const other = settings.config.find(item => item.otherKey === key);
  if (other) return `${t(other.label)} - ${t('optOther')}`;
  if (key === 'company') return t('vendorCompany');
  if (key === 'name') return t('customerName');
  if (key === 'email') return t('customerEmail');
  if (key === 'phone') return t('customerPhone');
  return t(key) || key;
}

function formatOption(kind, key, value) {
  if (!value) return '';
  const settings = resultsSettings[kind];
  const configItem = settings.config.find(item => item.key === key);
  if (!configItem) return value;
  const option = (configItem.options || []).find(opt => opt.value === value);
  if (!option) return value;
  return optionLabel(option);
}

function formatArrayOptions(kind, key, values) {
  if (!Array.isArray(values)) return formatOption(kind, key, values);
  const settings = resultsSettings[kind];
  const configItem = settings.config.find(item => item.key === key);
  if (!configItem) return values.join(', ');
  return values.map(val => {
    const opt = (configItem.options || []).find(o => o.value === val);
    if (!opt) return val;
    return optionLabel(opt);
  }).join(', ');
}

function computeVendorKPIs(entries) {
  const count = entries.length;
  const orderMap = { '0-10': 5, '10-20': 15, '20-40': 30, '40-80': 60, '80+': 90 };
  const avgOrders = count ? (entries.map(e => orderMap[e.orders_all] || 0).reduce((a,b)=>a+b,0) / count).toFixed(1) : '0';
  const avgProfit = count ? (entries.map(e => parseFloat(e.avg_profit || 0)).reduce((a,b)=>a+b,0) / count).toFixed(1) : '0';
  const acceptance = count ? Math.round((entries.filter(e => e.accept_10_20k === 'acceptable').length / count) * 100) : 0;
  return [
    { label: t('kpiCount'), value: count },
    { label: t('kpiAvgOrders'), value: avgOrders },
    { label: t('vendorProfit'), value: `${avgProfit}%` },
    { label: t('kpiPositive'), value: `${acceptance}%` }
  ];
}

function computeCustomerKPIs(entries) {
  const count = entries.length;
  const avgEase = count ? (entries.map(e => parseInt(e.ease || 0, 10)).reduce((a,b)=>a+b,0) / count).toFixed(1) : '0';
  const avgNps = count ? (entries.map(e => parseInt(e.nps || 0, 10)).reduce((a,b)=>a+b,0) / count).toFixed(1) : '0';
  const promoters = count ? Math.round((entries.filter(e => ['much-more','slightly-more'].includes(e.time_save)).length / count) * 100) : 0;
  return [
    { label: t('kpiCount'), value: count },
    { label: t('kpiAvgEase'), value: avgEase },
    { label: t('kpiAvgNps'), value: avgNps },
    { label: t('kpiPositive'), value: `${promoters}%` }
  ];
}

function computePublicKPIs(entries) {
  const count = entries.length;
  const booked = count ? Math.round((entries.filter(e => e.booked_before === 'yes').length / count) * 100) : 0;
  const willing = count ? Math.round((entries.filter(e => ['yes','maybe'].includes(e.premium)).length / count) * 100) : 0;
  return [
    { label: t('kpiCount'), value: count },
    { label: t('publicBookedBefore'), value: `${booked}%` },
    { label: t('publicPremium'), value: `${willing}%` }
  ];
}

function buildKPIGrid(container, items) {
  container.innerHTML = '';
  container.className = 'stats-grid';
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'stat-card';
    card.innerHTML = `<span>${item.label}</span><strong style="font-size:1.4rem;">${item.value}</strong>`;
    container.appendChild(card);
  });
}

function chartId(kind, key) {
  return `${kind}-${key}-chart`;
}

function renderCharts(container, kind, entries) {
  container.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'chart-grid';
  const config = resultsSettings[kind].config;
  config.forEach(item => {
    if (!item.options) return;
    const dataMap = new Map();
    const isMulti = item.type === 'checkbox-group';
    entries.forEach(entry => {
      const value = entry[item.key];
      if (!value) return;
      if (isMulti && Array.isArray(value)) {
        value.forEach(val => {
          const opt = (item.options || []).find(o => o.value === val);
          const label = optionLabel(opt || { label: val });
          dataMap.set(label, (dataMap.get(label) || 0) + 1);
        });
      } else {
        const opt = (item.options || []).find(o => o.value === value);
        const label = optionLabel(opt || { label: value });
        dataMap.set(label, (dataMap.get(label) || 0) + 1);
      }
    });
    if (dataMap.size === 0) return;
    const canvas = document.createElement('canvas');
    const section = document.createElement('div');
    section.className = 'glass-card';
    section.style.padding = '20px';
    section.innerHTML = `<h3 style="margin-top:0;">${t(item.label)}</h3>`;
    section.appendChild(canvas);
    grid.appendChild(section);
    const labels = Array.from(dataMap.keys());
    const values = Array.from(dataMap.values());
    const chart = new Chart(canvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: t(item.label),
          data: values,
          backgroundColor: '#5a5df0'
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false }
        },
        scales: {
          x: { ticks: { callback: function(value, idx) { return labels[idx]; }, autoSkip: false } },
          y: { beginAtZero: true, precision: 0 }
        }
      }
    });
    ChartsRegistry.set(chartId(kind, item.key), chart);
  });
  container.appendChild(grid);
}

function buildTextLists(container, entries, kind) {
  container.innerHTML = '';
  const settings = resultsSettings[kind];
  const otherLabel = key => {
    const parent = settings.config.find(item => item.otherKey === key);
    if (parent) return `${t(parent.label)} - ${t('optOther')}`;
    return key;
  };
  const openSection = document.createElement('div');
  openSection.className = 'open-text-section';
  openSection.innerHTML = `<h3>${t('openTextHeader')}</h3>`;
  let hasOpen = false;
  settings.openText.forEach(key => {
    entries.forEach(entry => {
      const value = entry[key];
      if (value) {
        hasOpen = true;
        openSection.appendChild(createTextItem(value));
      }
    });
  });
  if (!hasOpen) {
    const empty = document.createElement('div');
    empty.className = 'text-item';
    empty.textContent = t('otherNone');
    openSection.appendChild(empty);
  }
  container.appendChild(openSection);

  const otherSection = document.createElement('div');
  otherSection.className = 'open-text-section';
  otherSection.innerHTML = `<h3>${t('otherHeader')}</h3>`;
  let hasOther = false;
  settings.otherFields.forEach(key => {
    entries.forEach(entry => {
      const value = entry[key];
      if (value) {
        hasOther = true;
        otherSection.appendChild(createTextItem(`${otherLabel(key)}: ${value}`));
      }
    });
  });
  if (!hasOther) {
    const empty = document.createElement('div');
    empty.className = 'text-item';
    empty.textContent = t('otherNone');
    otherSection.appendChild(empty);
  }
  container.appendChild(otherSection);

function createTextItem(text) {
  const item = document.createElement('div');
  item.className = 'text-item';
  const span = document.createElement('span');
  span.textContent = text;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'copy-btn';
  btn.textContent = t('copy');
  btn.addEventListener('click', () => {
    navigator.clipboard?.writeText(text).then(() => toast(t('toastCopied')));
  });
  item.appendChild(span);
  item.appendChild(btn);
  return item;
}

function buildTable(container, entries, kind) {
  container.innerHTML = '';
  const settings = resultsSettings[kind];
  const controls = document.createElement('div');
  controls.className = 'table-controls';
  const search = document.createElement('input');
  search.className = 'search-input';
  search.setAttribute('placeholder', t('tableSearchPlaceholder'));
  controls.appendChild(search);
  const sortDate = document.createElement('button');
  sortDate.className = 'sort-btn';
  sortDate.textContent = t('sortDate');
  controls.appendChild(sortDate);
  const sortName = document.createElement('button');
  sortName.className = 'sort-btn';
  sortName.textContent = t('sortName');
  controls.appendChild(sortName);
  container.appendChild(controls);

  const wrap = document.createElement('div');
  wrap.className = 'table-wrap glass-card';
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');
  settings.columns.forEach(col => {
    const th = document.createElement('th');
    th.textContent = t(col.label);
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  table.appendChild(tbody);
  wrap.appendChild(table);
  container.appendChild(wrap);

  let currentData = [...entries];

  function renderRows() {
    tbody.innerHTML = '';
    if (currentData.length === 0) {
      const row = document.createElement('tr');
      const cell = document.createElement('td');
      cell.colSpan = settings.columns.length;
      cell.textContent = t('noResponses');
      row.appendChild(cell);
      tbody.appendChild(row);
      return;
    }
    currentData.forEach(entry => {
      const row = document.createElement('tr');
      settings.columns.forEach(col => {
        const td = document.createElement('td');
        const value = entry[col.key];
        if (Array.isArray(value)) {
          td.textContent = formatArrayOptions(kind, col.key, value);
        } else if (col.key === 'ts') {
          td.textContent = value ? new Date(value).toLocaleString() : '';
        } else if (['orders_all','orders_profitable','min_orders_to_stay','accept_5_10k','accept_10_20k','accept_20k_plus','leave_reason','recommend','freq','time_save','money_save','more','category','booked_before','barrier','top_factor','first_cat','premium','platforms'].includes(col.key)) {
          td.textContent = formatArrayOptions(kind, col.key, Array.isArray(value) ? value : [value]).replace(/, /g, currentLanguage === 'ar' ? '، ' : ', ');
        } else {
          td.textContent = formatValue(value);
        }
        row.appendChild(td);
      });
      row.addEventListener('click', () => openDetailModal(kind, entry));
      tbody.appendChild(row);
    });
  }

  function applySearch() {
    const query = search.value.toLowerCase();
    if (!query) {
      currentData = [...entries];
    } else {
      currentData = entries.filter(entry => {
        return ['company','name','email','phone','category'].some(key => (entry[key] || '').toString().toLowerCase().includes(query));
      });
    }
    renderRows();
  }

  search.addEventListener('input', applySearch);
  sortDate.addEventListener('click', () => {
    currentData.sort((a,b) => new Date(b.ts || 0) - new Date(a.ts || 0));
    renderRows();
  });
  sortName.addEventListener('click', () => {
    currentData.sort((a,b) => ((a.company || a.name || '')).localeCompare(b.company || b.name || ''));
    renderRows();
  });
  renderRows();
}

function openDetailModal(kind, entry) {
  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  const inner = document.createElement('div');
  inner.className = 'modal';
  inner.innerHTML = `<button class="close-btn" aria-label="Close">×</button><h3>${t('detailTitle')(kind)}</h3>`;
  const list = document.createElement('div');
  list.className = 'open-text-section';
  Object.entries(entry).forEach(([key, value]) => {
    const item = document.createElement('div');
    item.className = 'text-item';
    const label = document.createElement('strong');
    label.textContent = fieldLabel(kind, key);
    const span = document.createElement('span');
    if (Array.isArray(value)) {
      span.textContent = formatArrayOptions(kind, key, value);
    } else if (key === 'ts') {
      span.textContent = value ? new Date(value).toLocaleString() : '';
    } else if (['orders_all','orders_profitable','min_orders_to_stay','accept_5_10k','accept_10_20k','accept_20k_plus','leave_reason','recommend','freq','time_save','money_save','more','category','booked_before','barrier','top_factor','first_cat','premium','platforms'].includes(key)) {
      span.textContent = formatArrayOptions(kind, key, [value]);
    } else {
      span.textContent = value ?? '';
    }
    item.appendChild(label);
    item.appendChild(span);
    list.appendChild(item);
  });
  inner.appendChild(list);
  modal.appendChild(inner);
  document.body.appendChild(modal);
  modal.querySelector('.close-btn').addEventListener('click', () => modal.remove());
  modal.addEventListener('click', e => {
    if (e.target === modal) modal.remove();
  });
}

function renderResults(kind, container) {
  clearCharts();
  const db = getDB();
  const entries = db[kind] || [];
  container.innerHTML = '';
  const heading = document.createElement('h2');
  heading.textContent = t(resultsSettings[kind].titleKey);
  container.appendChild(heading);
  if (entries.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = t('noResponses');
    container.appendChild(empty);
    return;
  }
  const kpiContainer = document.createElement('div');
  container.appendChild(kpiContainer);
  if (kind === 'vendor') buildKPIGrid(kpiContainer, computeVendorKPIs(entries));
  if (kind === 'customer') buildKPIGrid(kpiContainer, computeCustomerKPIs(entries));
  if (kind === 'public') buildKPIGrid(kpiContainer, computePublicKPIs(entries));

  const chartContainer = document.createElement('div');
  container.appendChild(chartContainer);
  renderCharts(chartContainer, kind, entries);

  const textContainer = document.createElement('div');
  container.appendChild(textContainer);
  buildTextLists(textContainer, entries, kind);

  const tableContainer = document.createElement('div');
  container.appendChild(tableContainer);
  buildTable(tableContainer, entries, kind);
}

function exportJSON() {
  const db = getDB();
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'tamam-research.json';
  link.click();
  URL.revokeObjectURL(url);
  toast(t('toastExported'));
}

function exportExcel() {
  const db = getDB();
  const wb = XLSX.utils.book_new();
  ['vendor','customer','public'].forEach(kind => {
    const data = db[kind] || [];
    const rows = data.map(entry => {
      const row = { ...entry };
      Object.keys(row).forEach(key => {
        if (Array.isArray(row[key])) row[key] = row[key].join(', ');
      });
      return row;
    });
    const sheet = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, sheet, kind.charAt(0).toUpperCase() + kind.slice(1));
  });
  const now = new Date();
  const stamp = now.toISOString().replace(/[-:T]/g, '').slice(0, 12);
  XLSX.writeFile(wb, `tamam-research-export-${stamp}.xlsx`);
  toast(t('toastExported'));
}

function importJSONFile(file, onComplete) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      const db = getDB();
      ['vendor','customer','public'].forEach(kind => {
        if (Array.isArray(imported[kind])) {
          db[kind] = db[kind].concat(imported[kind]);
        }
      });
      saveDB(db);
      document.dispatchEvent(new CustomEvent('tamam:dataUpdated', { detail: { kind: 'all' } }));
      toast(t('toastImportSuccess'));
      if (onComplete) onComplete();
    } catch (err) {
      console.error(err);
      toast(t('toastError'));
    }
  };
  reader.readAsText(file);
}

function backupAndReset() {
  exportJSON();
  exportExcel();
  localStorage.removeItem(STORAGE_KEYS.db);
  Object.values(STORAGE_KEYS.drafts).forEach(key => localStorage.removeItem(key));
  Object.values(STORAGE_KEYS.completed).forEach(key => localStorage.removeItem(key));
  initDB();
  toast(t('toastReset'));
  document.dispatchEvent(new CustomEvent('tamam:dataUpdated', { detail: { kind: 'all' } }));
}

function postToNetlify(kind, payload) {
  const formName = `tamam-${kind}`;
  const body = new URLSearchParams();
  body.append('form-name', formName);
  body.append('data', JSON.stringify(payload));
  fetch('/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body.toString()
  }).catch(err => {
    if (DEBUG) console.warn('Netlify post failed', err);
  });
}

ROUTES['surveys/results'] = {
  key: 'surveys/results',
  guard: () => requirePassword('results'),
  mount() {
    const app = document.getElementById('app');
    app.innerHTML = '';
    const page = document.createElement('div');
    page.className = 'page';
    const header = document.createElement('section');
    header.className = 'section-card glass-card';
    header.innerHTML = `<h1>${t('resultsTitle')}</h1>`;
    const actions = document.createElement('div');
    actions.className = 'results-actions';
    const refreshBtn = document.createElement('button');
    refreshBtn.className = 'action-btn';
    refreshBtn.textContent = t('refresh');
    actions.appendChild(refreshBtn);
    const exportExcelBtn = document.createElement('button');
    exportExcelBtn.className = 'action-btn';
    exportExcelBtn.textContent = t('exportExcel');
    actions.appendChild(exportExcelBtn);
    const exportJsonBtn = document.createElement('button');
    exportJsonBtn.className = 'action-btn';
    exportJsonBtn.textContent = t('exportJson');
    actions.appendChild(exportJsonBtn);
    const importBtn = document.createElement('button');
    importBtn.className = 'action-btn';
    importBtn.textContent = t('importJson');
    actions.appendChild(importBtn);
    const resetBtn = document.createElement('button');
    resetBtn.className = 'action-btn';
    resetBtn.textContent = t('resetAll');
    actions.appendChild(resetBtn);
    header.appendChild(actions);
    page.appendChild(header);

    const tabs = document.createElement('div');
    tabs.className = 'tabs';
    const content = document.createElement('section');
    content.className = 'section-card glass-card';
    const tabContent = document.createElement('div');
    content.appendChild(tabContent);

    const kinds = ['vendor','customer','public'];
    let activeKind = 'vendor';
    function renderTabs() {
      tabs.innerHTML = '';
      kinds.forEach(kind => {
        const btn = document.createElement('button');
        btn.textContent = t(resultsSettings[kind].titleKey);
        btn.classList.toggle('active', kind === activeKind);
        btn.addEventListener('click', () => {
          activeKind = kind;
          renderTabs();
          renderResults(kind, tabContent);
        });
        tabs.appendChild(btn);
      });
    }
    renderTabs();
    renderResults(activeKind, tabContent);

    refreshBtn.addEventListener('click', () => {
      renderResults(activeKind, tabContent);
    });
    exportExcelBtn.addEventListener('click', exportExcel);
    exportJsonBtn.addEventListener('click', exportJSON);
    importBtn.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.addEventListener('change', () => {
        if (input.files?.length) {
          importJSONFile(input.files[0], () => renderResults(activeKind, tabContent));
        }
      }, { once: true });
      input.click();
    });
    resetBtn.addEventListener('click', () => {
      backupAndReset();
      renderResults(activeKind, tabContent);
    });

    page.appendChild(tabs);
    page.appendChild(content);
    app.appendChild(page);
  },
  unmount() {
    clearCharts();
  },
  refresh() {
    this.mount();
  }
};
initDB();
setTheme(currentTheme);
applyLanguage();
initRouter();

document.getElementById('themeToggle').addEventListener('click', toggleTheme);
document.getElementById('langToggle').addEventListener('click', toggleLanguage);

document.addEventListener('tamam:dataUpdated', () => {
  if (currentRoute && currentRoute.key === 'surveys/results') {
    currentRoute.mount();
  }
});

</script>
