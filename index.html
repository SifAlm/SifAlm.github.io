<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tamam Research Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" integrity="sha512-+CnCf1IDgwbghvYDn8ApX2HFqRSbuuSSMzdON3NofM8JrIoYNewc19hXtOD87mpy4V/mQJu1nvLKknj1ibJsbg==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <script async src="https://www.instagram.com/embed.js"></script>
  <style>
    :root {
      --bg: #F7F9FD;
      --text: #121722;
      --muted: #4B5565;
      --blue: #25ADFE;
      --purple: #A357D7;
      --coral: #E8635D;
      --green: #65C466;
      --card-bg: rgba(255,255,255,0.8);
      --border: rgba(18,23,34,0.08);
      --shadow: 0 18px 40px rgba(15,23,42,0.12);
    }
    [data-theme="dark"] {
      --bg: #0A0F1C;
      --text: #E6EEFC;
      --muted: #A7B3CC;
      --card-bg: rgba(10,15,28,0.75);
      --border: rgba(230,238,252,0.12);
      --shadow: 0 18px 42px rgba(3,8,20,0.55);
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background 0.3s ease, color 0.3s ease;
    }
    body {
      position: relative;
      padding: 0;
      overflow-x: hidden;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      width: 540px;
      height: 540px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(37,173,254,0.45), transparent 65%),
                  radial-gradient(circle at 70% 70%, rgba(163,87,215,0.35), transparent 70%),
                  radial-gradient(circle at 50% 50%, rgba(232,99,93,0.4), transparent 85%);
      filter: blur(0px);
      z-index: -2;
      transition: opacity 0.3s ease;
    }
    body::before {
      top: -220px;
      left: -220px;
      opacity: 0.75;
    }
    body::after {
      bottom: -260px;
      right: -260px;
      opacity: 0.65;
    }
    [data-theme="dark"]::before, [data-theme="dark"]::after {
      opacity: 0.85;
    }
    .app-shell {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px clamp(20px, 5vw, 48px) 16px;
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(18px);
      background: rgba(247,249,253,0.8);
      border-bottom: 1px solid var(--border);
      transition: background 0.3s ease, border 0.3s ease;
    }
    [data-theme="dark"] header {
      background: rgba(10,15,28,0.78);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      font-size: 18px;
      flex-shrink: 0;
      overflow: hidden;
    }
    @media (max-width: 720px) {
      header {
        padding: 18px 18px 12px;
      }
      .brand-icon {
        width: 32px;
        height: 32px;
        border-radius: 12px;
        font-size: 16px;
      }
    }
    .brand h1 {
      font-size: clamp(20px, 2.4vw, 26px);
      margin: 0;
      font-weight: 600;
    }
    nav {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .nav-link {
      text-decoration: none;
      color: var(--muted);
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid transparent;
      transition: background 0.2s ease, color 0.2s ease, border 0.2s ease;
    }
    .nav-link.active {
      background: linear-gradient(135deg, rgba(37,173,254,0.2), rgba(163,87,215,0.2));
      border-color: rgba(37,173,254,0.3);
      color: var(--text);
    }
    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .toggle-group {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .toggle {
      position: relative;
      width: 52px;
      height: 28px;
      border-radius: 999px;
      background: rgba(18,23,34,0.1);
      cursor: pointer;
      border: 1px solid rgba(18,23,34,0.12);
      transition: background 0.3s ease, border 0.3s ease;
    }
    [data-theme="dark"] .toggle {
      background: rgba(230,238,252,0.12);
      border-color: rgba(230,238,252,0.15);
    }
    .toggle-handle {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      transition: transform 0.3s ease;
    }
    .toggle[data-state="on"] .toggle-handle {
      transform: translateX(24px);
    }
    .lang-toggle {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .lang-toggle button {
      border: none;
      background: none;
      padding: 8px 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .lang-toggle button.active {
      background: linear-gradient(135deg, rgba(37,173,254,0.18), rgba(163,87,215,0.18));
      color: var(--text);
    }
    main {
      flex: 1;
      padding: clamp(24px, 5vw, 56px);
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: clamp(20px, 4vw, 32px);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      transition: background 0.3s ease, border 0.3s ease, box-shadow 0.3s ease;
    }
    .hero {
      display: grid;
      gap: 32px;
      margin-bottom: 36px;
    }
    .hero h2 {
      font-size: clamp(30px, 5vw, 46px);
      margin: 0 0 12px;
      font-weight: 700;
    }
    .hero p {
      margin: 0 0 24px;
      font-size: 18px;
      color: var(--muted);
      max-width: 640px;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn {
      border: none;
      border-radius: 999px;
      padding: 14px 22px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      font-size: 16px;
    }
    .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(37,173,254,0.35);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--blue), var(--purple));
      color: #fff;
      box-shadow: 0 10px 24px rgba(37,173,254,0.35);
    }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }
    .btn:active {
      transform: translateY(1px);
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin-top: 36px;
    }
    .store-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }
    .store-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(37,173,254,0.1);
      border-radius: 16px;
      border: 1px solid rgba(37,173,254,0.2);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .store-links a:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(37,173,254,0.2);
    }
    .social-carousel {
      position: relative;
      overflow: hidden;
    }
    .social-track {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(260px, 320px);
      gap: 18px;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .social-track::-webkit-scrollbar {
      height: 6px;
    }
    .social-track::-webkit-scrollbar-thumb {
      background: rgba(37,173,254,0.4);
      border-radius: 999px;
    }
    .reel-card {
      position: relative;
      background: rgba(255,255,255,0.9);
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(15,23,42,0.14);
      overflow: hidden;
      scroll-snap-align: start;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
    }
    [data-theme="dark"] .reel-card {
      background: rgba(10,15,28,0.85);
    }
    .reel-card:hover {
      transform: translateY(-6px);
    }
    .reel-thumb {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
    .reel-caption {
      padding: 16px 18px 20px;
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
      flex: 1;
      overflow: hidden;
    }
    .reel-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0 18px 18px;
      padding: 12px 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(37,173,254,0.2), rgba(163,87,215,0.2));
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }
    .reel-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    .reel-card.embed-active .reel-fallback {
      opacity: 0;
      pointer-events: none;
    }
    .survey-container {
      display: grid;
      gap: 24px;
    }
    .survey-header {
      display: grid;
      gap: 12px;
    }
    .survey-header p {
      color: var(--muted);
      margin: 0;
    }
    form.survey-form {
      display: grid;
      gap: 20px;
    }
    .field {
      display: grid;
      gap: 10px;
    }
    .field label {
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .field label span.required {
      color: var(--coral);
    }
    .text-input, .custom-select-trigger, textarea {
      width: 100%;
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 14px 16px;
      background: rgba(255,255,255,0.9);
      font-size: 15px;
      color: var(--text);
      transition: border 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    [data-theme="dark"] .text-input,
    [data-theme="dark"] textarea,
    [data-theme="dark"] .custom-select-trigger {
      background: rgba(10,15,28,0.85);
    }
    .text-input:focus, textarea:focus, .custom-select-trigger:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(37,173,254,0.35);
      border-color: rgba(37,173,254,0.6);
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    .custom-select {
      position: relative;
    }
    .custom-select-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      gap: 12px;
    }
    .custom-options {
      position: absolute;
      z-index: 10;
      top: calc(100% + 8px);
      left: 0;
      width: 100%;
      background: var(--card-bg);
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      max-height: 260px;
      overflow-y: auto;
      padding: 8px 0;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .custom-select.open .custom-options {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .custom-option {
      padding: 12px 18px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .custom-option:hover, .custom-option.active {
      background: rgba(37,173,254,0.12);
    }
    .choice-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 10px 14px;
      background: rgba(255,255,255,0.9);
      cursor: pointer;
      transition: background 0.2s ease, border 0.2s ease;
    }
    .chip input {
      margin: 0;
    }
    [data-theme="dark"] .chip {
      background: rgba(10,15,28,0.85);
    }
    .chip:hover {
      border-color: rgba(37,173,254,0.5);
    }
    .error-text {
      color: var(--coral);
      font-size: 13px;
    }
    .progress-bar {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .progress-track {
      flex: 1;
      height: 8px;
      border-radius: 999px;
      background: rgba(18,23,34,0.08);
      overflow: hidden;
    }
    [data-theme="dark"] .progress-track {
      background: rgba(230,238,252,0.15);
    }
    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--purple));
      width: 0%;
      transition: width 0.2s ease;
    }
    .timer-display {
      font-weight: 600;
      color: var(--muted);
    }
    .survey-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
    }
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: grid;
      gap: 12px;
      z-index: 30;
    }
    .toast {
      padding: 14px 18px;
      border-radius: 16px;
      background: rgba(10,15,28,0.9);
      color: #fff;
      min-width: 220px;
      box-shadow: 0 12px 32px rgba(15,23,42,0.35);
      animation: toastIn 0.3s ease;
      font-weight: 600;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} 
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8,12,22,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 40;
      padding: 20px;
    }
    .modal-backdrop.active {
      display: flex;
    }
    .modal {
      width: min(420px, 100%);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 18px;
    }
    .modal h3 {
      margin: 0;
      font-size: 22px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }
    .kpi-card {
      padding: 18px 20px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      display: grid;
      gap: 8px;
      box-shadow: var(--shadow);
    }
    .kpi-card span {
      color: var(--muted);
      font-size: 14px;
    }
    .kpi-card strong {
      font-size: 28px;
      font-weight: 700;
    }
    .charts-grid {
      display: grid;
      gap: 24px;
    }
    @media (min-width: 960px) {
      .charts-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    .chart-card {
      padding: 20px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      box-shadow: var(--shadow);
      display: grid;
      gap: 14px;
    }
    .text-block {
      padding: 20px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      box-shadow: var(--shadow);
      display: grid;
      gap: 16px;
    }
    .text-block h4 {
      margin: 0;
      font-size: 20px;
    }
    .text-block pre {
      margin: 0;
      background: rgba(18,23,34,0.05);
      border-radius: 16px;
      padding: 12px 14px;
      max-height: 220px;
      overflow: auto;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    [data-theme="dark"] .text-block pre {
      background: rgba(230,238,252,0.08);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    .toolbar .btn {
      padding: 12px 18px;
      font-size: 15px;
    }
    .copy-btn {
      justify-self: flex-start;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      font-weight: 600;
      color: var(--muted);
      transition: border 0.2s ease, color 0.2s ease;
    }
    .copy-btn:hover {
      border-color: rgba(37,173,254,0.5);
      color: var(--text);
    }
    .thanks-card {
      text-align: center;
      display: grid;
      gap: 18px;
    }
    .thanks-card h2 {
      font-size: clamp(32px, 5vw, 42px);
      margin: 0;
    }
    .rtl {
      direction: rtl;
      text-align: right;
    }
    .rtl .brand h1 {
      text-align: inherit;
    }
    .rtl .survey-footer {
      flex-direction: row-reverse;
    }
    .rtl .choice-list {
      justify-content: flex-end;
    }
    .rtl nav {
      flex-direction: row-reverse;
    }
    .rtl .toast-container {
      right: auto;
      left: 24px;
    }
    .rtl .modal {
      text-align: right;
    }
    input[type="email"], input[type="tel"], input[type="number"], input[type="text"].ltr-force {
      direction: ltr;
    }
    .loading-dim {
      opacity: 0.5;
      pointer-events: none;
    }
    @media (max-width: 640px) {
      .survey-footer {
        flex-direction: column;
        align-items: stretch;
      }
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 600;
      border: 1px solid rgba(101,196,102,0.4);
      color: var(--green);
      background: rgba(101,196,102,0.12);
    }
    .disabled-card {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      border-radius: 24px;
      border: 1px dashed var(--border);
      background: var(--card-bg);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .imgur-card {
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--card-bg);
      box-shadow: var(--shadow);
      padding: 12px;
    }
  </style>
</head>
<body data-theme="light">
  <div class="app-shell" id="app">
    <header>
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="100%" height="100%" role="presentation">
            <defs>
              <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#25ADFE"/>
                <stop offset="50%" stop-color="#A357D7"/>
                <stop offset="100%" stop-color="#E8635D"/>
              </linearGradient>
            </defs>
            <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#grad)"/>
            <text x="50%" y="54%" text-anchor="middle" font-size="34" font-family="Inter, sans-serif" fill="#fff" font-weight="700">T</text>
          </svg>
        </div>
        <h1 id="app-title">Tamam Research Portal</h1>
      </div>
      <nav aria-label="Primary" id="nav-links"></nav>
      <div class="header-actions">
        <div class="toggle-group">
          <span class="sr-only" id="theme-label">Toggle theme</span>
          <div class="toggle" role="switch" tabindex="0" aria-labelledby="theme-label" id="theme-toggle">
            <div class="toggle-handle"></div>
          </div>
        </div>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" data-lang="en" class="active">EN</button>
          <button type="button" data-lang="ar">AR</button>
        </div>
      </div>
    </header>

    function getDB() {
      try {

        const parsed = JSON.parse(raw);
        return {
          vendor: Array.isArray(parsed.vendor) ? parsed.vendor : [],
          customer: Array.isArray(parsed.customer) ? parsed.customer : [],
          public: Array.isArray(parsed.public) ? parsed.public : []
        };
      } catch (err) {
        console.error('DB parse error', err);
        return { vendor: [], customer: [], public: [] };
      }

    function ensureDraft(kind) {
      const key = DRAFT_PREFIX + kind;
      const raw = localStorage.getItem(key);
      if (!raw) return {};
      try { return JSON.parse(raw) || {}; } catch { return {}; }

    function saveDraft(kind, data) {
      localStorage.setItem(DRAFT_PREFIX + kind, JSON.stringify(data));

    function startTimer() {
      state.timerStart = Date.now();
      updateTimer();
      clearInterval(state.timerInterval);
      state.timerInterval = setInterval(updateTimer, 1000);
    }

    function stopTimer() {
      clearInterval(state.timerInterval);
      state.timerInterval = null;
    }

    function updateTimer() {
      const display = document.querySelector('.timer-display');
      if (!display || !state.timerStart) return;
      const elapsed = Math.floor((Date.now() - state.timerStart) / 1000);
      const minutes = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const seconds = String(elapsed % 60).padStart(2, '0');
      display.textContent = `${minutes}:${seconds}`;
    }

    function currentSeconds() {
      if (!state.timerStart) return 0;
      return Math.floor((Date.now() - state.timerStart) / 1000);
    }

    function routeTo(hash) {

    function handleHashChange() {
      const hash = window.location.hash || '#/surveys';
      state.route = hash;
      if (DEBUG) console.log('navigate to', hash);
      const route = routes[hash];
      if (!route) {
        state.route = '#/surveys';
        rerender();
        return;
      }
      if (route.pass) {
        openPasswordPrompt(route.pass, hash, !!route.alwaysPrompt);
      } else {
        rerender();
      }

      passwordModal.setAttribute('aria-hidden', 'false');
      passwordInput.value = '';
      passwordInput.focus();
    }

    passwordForm.addEventListener('submit', (e) => {
      e.preventDefault();

        passwordModal.setAttribute('aria-hidden', 'true');

    function createReelCard(url) {
      const card = document.createElement('div');
      card.className = 'reel-card';

      const blockquote = document.createElement('blockquote');
      blockquote.className = 'instagram-media';
      blockquote.dataset.instgrmPermalink = url;
      blockquote.dataset.instgrmVersion = '14';
      card.appendChild(blockquote);

      const fallback = document.createElement('div');
      fallback.className = 'reel-fallback';
      const img = document.createElement('img');
      img.className = 'reel-thumb';
      img.alt = t('igCanvasSubtitle');
      img.src = createNeutralPoster();
      img.addEventListener('error', () => {
        img.src = createNeutralPoster();
      });
      const caption = document.createElement('div');
      caption.className = 'reel-caption';
      caption.textContent = t('captionUnavailable');
      const link = document.createElement('a');
      link.className = 'reel-link';
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.setAttribute('aria-label', t('igFallback'));
      link.textContent = t('igCta');
      fallback.append(img, caption, link);
      card.appendChild(fallback);

      // Attempt fetch for oEmbed fallback
      fetchOEmbed(url).then(data => {
        if (data?.thumbnail_url) {
          img.src = data.thumbnail_url;
        } else {
          img.src = createNeutralPoster();
        }
        caption.textContent = data?.title || t('captionUnavailable');
      }).catch(() => {
        img.src = createNeutralPoster();
        caption.textContent = t('captionUnavailable');
      }).finally(() => {
        setTimeout(() => {
          if (card.querySelector('iframe')) {
            card.classList.add('embed-active');
          } else if (!window.instgrm) {
            card.classList.remove('embed-active');
          }
        }, 2000);
      });

      return card;
    }

    function createNeutralPoster() {
      const canvas = document.createElement('canvas');
      canvas.width = 600;
      canvas.height = 800;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 600, 800);
      gradient.addColorStop(0, '#25ADFE');
      gradient.addColorStop(0.5, '#A357D7');
      gradient.addColorStop(1, '#E8635D');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 600, 800);
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.font = 'bold 48px Inter';
      ctx.fillText(t('igCanvasTitle'), 40, 100);
      ctx.font = '28px Inter';
      ctx.fillText(t('igCanvasSubtitle'), 40, 170);
      return canvas.toDataURL('image/png');
    }

    async function fetchOEmbed(url) {
      try {
        const response = await fetch(`https://graph.facebook.com/v12.0/instagram_oembed?url=${encodeURIComponent(url)}&omitscript=true`);
        if (!response.ok) throw new Error('oEmbed failed');
        return await response.json();
      } catch (error) {
        if (DEBUG) console.warn('oEmbed fallback failed', error);
        throw error;
      }
    }

    function buildField(config, draft) {
      const field = document.createElement('div');
      field.className = 'field';
      field.dataset.fieldId = config.id;
      if (config.dependsOn) field.dataset.dependsOn = config.dependsOn.field;

      const label = document.createElement('label');
      label.htmlFor = `field-${config.id}`;
      label.textContent = t(config.labelKey);
      if (config.required) {
        const requiredMark = document.createElement('span');
        requiredMark.className = 'required';
        requiredMark.textContent = t('requiredMark');
        label.appendChild(requiredMark);
      }
      field.appendChild(label);
      if (config.helperKey) {
        const helper = document.createElement('small');
        helper.style.color = 'var(--muted)';
        helper.textContent = t(config.helperKey);
        field.appendChild(helper);
      }

      let inputEl;
      const savedValue = draft?.[config.id];

      switch (config.type) {
        case 'text':
        case 'email':
        case 'tel':
        case 'number': {
          inputEl = document.createElement('input');
          inputEl.type = config.type === 'range' ? 'number' : config.type;
          inputEl.id = `field-${config.id}`;
          inputEl.className = 'text-input' + (config.type === 'text' ? '' : ' ltr-force');
          if (config.type === 'number') {
            if (config.min != null) inputEl.min = config.min;
            if (config.max != null) inputEl.max = config.max;
            inputEl.step = 'any';
          }
          if (savedValue != null) inputEl.value = savedValue;
          inputEl.required = config.required;
          field.appendChild(inputEl);
          break;
        }
        case 'textarea': {
          inputEl = document.createElement('textarea');
          inputEl.id = `field-${config.id}`;
          inputEl.className = 'text-input';
          if (savedValue != null) inputEl.value = savedValue;
          inputEl.required = config.required;
          field.appendChild(inputEl);
          break;
        }
        case 'range': {
          inputEl = document.createElement('input');
          inputEl.type = 'range';
          inputEl.id = `field-${config.id}`;
          inputEl.className = 'text-input';
          inputEl.min = config.min;
          inputEl.max = config.max;
          inputEl.step = 1;
          const display = document.createElement('div');
          display.style.color = 'var(--muted)';
          display.textContent = savedValue ?? config.min;
          inputEl.value = savedValue ?? config.min;
          inputEl.addEventListener('input', () => {
            display.textContent = inputEl.value;
          });
          field.append(inputEl, display);
          break;
        }
        case 'select': {
          const select = createCustomSelect(config, savedValue, draft);
          field.appendChild(select.wrapper);
          break;
        }
        case 'radio':
        case 'radio-conditional': {
          const group = document.createElement('div');
          group.className = 'choice-list';
          config.options.forEach(option => {
            const chip = document.createElement('label');
            chip.className = 'chip';
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = config.id;
            input.value = option.value;
            input.required = config.required;
            if (savedValue === option.value) input.checked = true;
            chip.appendChild(input);
            chip.append(t(option.labelKey));
            group.appendChild(chip);

            if (option.otherField) {
              const otherInput = createOtherInput(option.otherField, draft?.[option.otherField], config.required);
              otherInput.classList.add('other-input');
              otherInput.hidden = savedValue !== option.value;
              chip.appendChild(otherInput);
              input.addEventListener('change', () => {
                toggleOtherInputs(group, option.otherField, input.checked);
              });
            } else {
              input.addEventListener('change', () => {
                hideSiblingsOther(group);
              });
            }
          });
          field.appendChild(group);
          break;
        }
        case 'multi':
        case 'multi-conditional': {
          const group = document.createElement('div');
          group.className = 'choice-list';
          const savedArray = Array.isArray(savedValue) ? savedValue : [];
          config.options.forEach(option => {
            const chip = document.createElement('label');
            chip.className = 'chip';
            const input = document.createElement('input');
            input.type = 'checkbox';
            input.name = config.id;
            input.value = option.value;
            if (savedArray.includes(option.value)) input.checked = true;
            chip.appendChild(input);
            chip.append(t(option.labelKey));
            group.appendChild(chip);

            if (option.otherField) {
              const otherInput = createOtherInput(option.otherField, draft?.[option.otherField], config.required);
              otherInput.classList.add('other-input');
              otherInput.hidden = !savedArray.includes(option.value);
              chip.appendChild(otherInput);
              input.addEventListener('change', () => {
                otherInput.hidden = !input.checked;
                otherInput.querySelector('input').required = input.checked;
              });
            }
          });
          field.appendChild(group);
          break;
        }
        default:
          break;
      }

      if (config.enforceOther) {
        const chips = field.querySelectorAll('.chip input[type="radio"]');
        chips.forEach(chip => {
          chip.addEventListener('change', () => {
            const otherField = field.querySelector('.other-input input');
            if (!otherField) return;
            otherField.required = chip.checked && chip.value === 'Other';
            otherField.parentElement.hidden = !(chip.checked && chip.value === 'Other');
          });
        });
      }

      const error = document.createElement('div');
      error.className = 'error-text';
      error.hidden = true;
      field.appendChild(error);
      return field;
    }




    function createCustomSelect(config, savedValue, draft) {
      const wrapper = document.createElement('div');
      wrapper.className = 'custom-select';
      const trigger = document.createElement('button');
      trigger.type = 'button';
      trigger.className = 'custom-select-trigger';
      trigger.id = `field-${config.id}`;
      trigger.dataset.value = savedValue || '';
      const initialOption = config.options.find(opt => opt.value === savedValue);
      trigger.textContent = initialOption ? t(initialOption.labelKey) : t('selectPrompt');
      trigger.setAttribute('aria-haspopup', 'listbox');
      trigger.addEventListener('click', () => {
        document.querySelectorAll('.custom-select').forEach(sel => {
          if (sel !== wrapper) sel.classList.remove('open');
        });
        wrapper.classList.toggle('open');
      });
      trigger.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          wrapper.classList.toggle('open');
        }
      });
      trigger.addEventListener('blur', () => {
        setTimeout(() => wrapper.classList.remove('open'), 150);
      });

      const options = document.createElement('div');
      options.className = 'custom-options';
      config.options.forEach(option => {
        const opt = document.createElement('div');
        opt.className = 'custom-option';
        opt.dataset.value = option.value;
        opt.textContent = t(option.labelKey);
        if (option.value === savedValue) opt.classList.add('active');
        opt.addEventListener('click', () => {
          trigger.dataset.value = option.value;
          trigger.textContent = t(option.labelKey);
          options.querySelectorAll('.custom-option').forEach(o => o.classList.remove('active'));
          opt.classList.add('active');
          wrapper.classList.remove('open');
          const hidden = wrapper.querySelector('input[type="hidden"]');
          hidden.value = option.value;
          hidden.dispatchEvent(new Event('change', { bubbles: true }));
          handleOtherSelect(wrapper, option.otherField, config.required, !!option.otherField);
        });
        options.appendChild(opt);
      });

      const hidden = document.createElement('input');
      hidden.type = 'hidden';
      hidden.name = config.id;
      hidden.required = config.required;
      hidden.value = savedValue || '';

      wrapper.append(trigger, options, hidden);
      const otherOption = config.options.find(o => o.otherField);
      if (otherOption) {
        const otherValue = draft?.[otherOption.otherField] || '';
        const otherInput = createOtherInput(otherOption.otherField, otherValue, config.required);
        const input = otherInput.querySelector('input');
        if (savedValue === otherOption.value) {
          otherInput.hidden = false;
          input.required = true;
          input.name = otherOption.otherField;
        } else {
          otherInput.hidden = true;
          input.required = false;
          input.name = '';
        }
        wrapper.appendChild(otherInput);
      }
      return { wrapper };
    }

    function handleOtherSelect(wrapper, otherFieldKey, required, isOtherSelected) {
      const otherWrap = wrapper.querySelector('.other-input');
      if (!otherWrap) return;
      const input = otherWrap.querySelector('input');
      if (isOtherSelected && otherFieldKey) {
        otherWrap.hidden = false;
        input.name = otherFieldKey;
        input.required = required;
      } else {
        otherWrap.hidden = true;
        input.required = false;
        input.value = '';
      }
    }

    function computeProgress() {
      if (!state.currentForm) return;
      const fields = Array.from(state.currentForm.querySelectorAll('.field'));
      let requiredCount = 0;
      let answered = 0;

      fields.forEach(field => {
        if (!isFieldVisible(field)) return;
        const inputs = field.querySelectorAll('input, textarea');
        inputs.forEach(input => {
          if (input.type === 'hidden') return;
          if (input.name && input.closest('.other-input') && input.closest('.other-input').hidden) return;
          if (input.required) {
            requiredCount++;
            if (isInputFilled(input)) answered++;
          }
        });
      });

      if (requiredCount === 0) requiredCount = 1;
      const percent = Math.floor((answered / requiredCount) * 100);
      const fill = state.currentForm.parentElement.querySelector('.progress-fill');
      const pct = state.currentForm.parentElement.querySelector('.progress-percent');
      if (fill) fill.style.width = `${Math.min(percent, 99)}%`;
      if (pct) pct.textContent = `${Math.min(percent, 99)}% ${t('progressSuffix')}`;
    }


    function isInputFilled(input) {
      if (input.type === 'checkbox') {
        const group = state.currentForm.querySelectorAll(`input[name="${input.name}"][type="checkbox"]`);
        return Array.from(group).some(chk => chk.checked);
      }
      if (input.type === 'radio') {
        const selected = state.currentForm.querySelector(`input[name="${input.name}"]:checked`);
        return !!selected;
      }
      return input.value?.trim().length > 0;
    }

    function autosave(kind) {
      const data = collectFormData(kind, true);
      if (!data) return;
      saveDraft(surveyConfigs[kind].storageKey, data);
      if (DEBUG) console.log('autosave', data);
    }

    function collectFormData(kind, includeInvalid = false) {
      if (!state.currentForm) return null;
      const formData = new FormData(state.currentForm);
      const config = surveyConfigs[kind];
      const data = {};
      for (const field of config.fields) {
        if (field.type === 'multi' || field.type === 'multi-conditional') {
          const values = formData.getAll(field.id);
          data[field.id] = values;
          if (field.options.some(opt => opt.otherField)) {
            const otherOpt = field.options.find(opt => opt.otherField);
            const otherVal = formData.get(otherOpt.otherField) || '';
            data[otherOpt.otherField] = otherVal;
          }
        } else if (field.type === 'radio' || field.type === 'radio-conditional') {
          data[field.id] = formData.get(field.id) || '';
          field.options.forEach(opt => {
            if (opt.otherField) {
              data[opt.otherField] = formData.get(opt.otherField) || '';
            }
          });
        } else if (field.type === 'select') {
          data[field.id] = formData.get(field.id) || '';
          field.options.forEach(opt => {
            if (opt.otherField) {
              data[opt.otherField] = formData.get(opt.otherField) || '';
            }
          });
        } else {
          data[field.id] = formData.get(field.id) || '';
        }
      }
      if (!includeInvalid) {
        Object.keys(data).forEach(key => {
          if (Array.isArray(data[key])) {
            data[key] = data[key].filter(Boolean);
          }
        });
      }
      return data;
    }

    async function handleSubmit(kind) {
      const valid = validateForm(kind);
      if (!valid) {
        if (DEBUG) console.log('validation failed');
        return false;
      }
      const data = collectFormData(kind);
      if (!data) return false;
      const config = surveyConfigs[kind];
      const payload = { ...data, ts: Date.now(), seconds: currentSeconds() };
      if (kind === 'vendor') {
        payload.value_expect = Array.isArray(payload.value_expect) ? payload.value_expect : [];
      }
      if (kind === 'customer') {
        payload.cats = Array.isArray(payload.cats) ? payload.cats : [];
        payload.more = Array.isArray(payload.more) ? payload.more : [];
      }
      if (kind === 'public') {
        payload.platforms = Array.isArray(payload.platforms) ? payload.platforms : [];
      }
      if (DEBUG) console.log('submit payload', payload);

      const btn = state.currentForm.querySelector('button[type="submit"]');
      if (btn) {
        btn.disabled = true;
        btn.textContent = t('saving');
      }
      state.currentForm.classList.add('loading-dim');
      await new Promise(res => setTimeout(res, 400));
      const db = getDB();
      db[config.storageKey].push(payload);
      saveDB(db);
      clearDraft(config.storageKey);
      setCompleted(config.storageKey);
      showToast(t('saved'));
      state.currentForm.classList.remove('loading-dim');
      if (btn) {
        btn.disabled = false;
        btn.textContent = t('submit');
      }
      stopTimer();
      return true;
    }

    function validateForm(kind) {
      if (!state.currentForm) return false;
      let firstInvalid = null;
      Array.from(state.currentForm.querySelectorAll('.error-text')).forEach(el => el.hidden = true);
      const config = surveyConfigs[kind];

      config.fields.forEach(fieldConfig => {
        const field = state.currentForm.querySelector(`.field[data-field-id="${fieldConfig.id}"]`);
        if (!field || !isFieldVisible(field)) return;
        const error = field.querySelector('.error-text');
        const inputs = field.querySelectorAll('input, textarea');
        let isValid = true;

        if (fieldConfig.required) {
          if (fieldConfig.type === 'multi' || fieldConfig.type === 'multi-conditional') {
            const checked = field.querySelectorAll('input[type="checkbox"]:checked');
            isValid = checked.length > 0;
            fieldConfig.options.forEach(opt => {
              if (opt.otherField) {
                const other = field.querySelector(`input[name="${opt.otherField}"]`);
                if (other && !other.closest('.other-input').hidden && other.value.trim() === '') {
                  isValid = false;
                }
              }
            });
          } else if (fieldConfig.type === 'radio' || fieldConfig.type === 'radio-conditional') {
            const checked = field.querySelector('input[type="radio"]:checked');
            isValid = !!checked;
            if (checked) {
              const option = fieldConfig.options.find(opt => opt.value === checked.value);
              if (option?.otherField) {
                const other = field.querySelector(`input[name="${option.otherField}"]`);
                if (!other || other.value.trim() === '') isValid = false;
              }
            }
          } else if (fieldConfig.type === 'select') {
            const hidden = field.querySelector('input[type="hidden"]');
            isValid = hidden && hidden.value.trim() !== '';
            fieldConfig.options.forEach(opt => {
              if (opt.otherField) {
                const other = field.querySelector(`input[name="${opt.otherField}"]`);
                if (other && !other.closest('.other-input').hidden && other.value.trim() === '') {
                  isValid = false;
                }
              }
            });
          } else {
            inputs.forEach(input => {
              if (input.required && input.value.trim() === '') {
                isValid = false;
              }
            });
          }
        }

        if (!isValid) {
          error.textContent = t('fieldRequired');
          error.hidden = false;
          if (!firstInvalid) firstInvalid = inputs[0];
        }
      });

      if (firstInvalid) {
        firstInvalid.focus();
        return false;
      }
      return true;
    }

    function debounce(fn, wait) {
      let timeout;
      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn.apply(this, args), wait);
      };
    }

    function shouldFieldBeVisible(config, draft) {
      if (!config.dependsOn) return true;
      const current = draft?.[config.dependsOn.field] || '';
      return current === config.dependsOn.value;
    }

    function attachConditionalListeners(form, config) {
      config.fields.forEach(field => {
        if (!field.dependsOn) return;
        const dependentField = form.querySelector(`.field[data-field-id="${field.id}"]`);
        const controllerInputs = form.querySelectorAll(`[name="${field.dependsOn.field}"]`);
        controllerInputs.forEach(input => {
          input.addEventListener('change', () => {
            const shouldShow = getControllerValue(form, field.dependsOn.field) === field.dependsOn.value;
            dependentField.style.display = shouldShow ? '' : 'none';
            dependentField.querySelectorAll('input, textarea').forEach(el => {
              if (el.type === 'hidden') return;
              if (shouldShow) {
                el.disabled = false;
              } else {
                if (el.type === 'radio' || el.type === 'checkbox') el.checked = false;
                else el.value = '';
                el.disabled = true;
              }
            });
            computeProgress();
          });
        });
      });
    }

    function getControllerValue(form, fieldId) {
      const radios = form.querySelectorAll(`input[name="${fieldId}"][type="radio"]`);
      if (radios.length) {
        const checked = form.querySelector(`input[name="${fieldId}"]:checked`);
        return checked ? checked.value : '';
      }
      const select = form.querySelector(`[name="${fieldId}"]`);
      return select ? select.value : '';
    }

    function finalizeField(field, config, draft) {
      if (config.dependsOn) {
        field.dataset.dependsOn = config.dependsOn.field;
        field.dataset.dependsValue = config.dependsOn.value;
        const visible = shouldFieldBeVisible(config, draft);
        field.style.display = visible ? '' : 'none';
        field.querySelectorAll('input, textarea').forEach(el => {
          if (visible) {
            el.disabled = false;
          } else {
            if (el.type === 'radio' || el.type === 'checkbox') el.checked = false;
            else el.value = '';
            el.disabled = true;
          }
        });
      }
    }

    function updateSelectPlaceholder(wrapper, config) {
      const trigger = wrapper.querySelector('.custom-select-trigger');
      const hidden = wrapper.querySelector('input[type="hidden"]');
      const selected = config.options.find(opt => opt.value === hidden.value);
      trigger.textContent = selected ? t(selected.labelKey) : t('selectPrompt');
      handleOtherSelect(wrapper, selected?.otherField, config.required, !!selected?.otherField);
    }

    function isFieldVisible(field) {
      const dependsOn = field.dataset.dependsOn;
      if (!dependsOn) return true;
      const expected = field.dataset.dependsValue;
      const checked = state.currentForm?.querySelector(`input[name="${dependsOn}"]:checked`);
      if (checked) return checked.value === expected;
      const hidden = state.currentForm?.querySelector(`[name="${dependsOn}"]`);
      return hidden ? hidden.value === expected : false;
    }

    function hideSiblingsOther(group) {
      group.querySelectorAll('.other-input').forEach(wrap => {
        const input = wrap.querySelector('input');
        if (!input) return;
        wrap.hidden = true;
        input.required = false;
        input.value = '';
      });
    }

    function toggleOtherInputs(group, fieldId, show) {
      group.querySelectorAll('.other-input').forEach(wrap => {
        const input = wrap.querySelector('input');
        if (!input) return;
        if (input.dataset.otherId === fieldId && show) {
          wrap.hidden = false;
          input.required = true;
          input.name = fieldId;
        } else {
          wrap.hidden = true;
          input.required = false;
          input.value = '';
          input.name = '';
        }
      });
    }

    function createOtherInput(id, value, required) {
      const wrap = document.createElement('div');
      wrap.className = 'other-input';
      wrap.style.display = 'flex';
      wrap.style.width = '100%';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'text-input';
      input.placeholder = t('otherSpecify');
      input.name = value ? id : '';
      input.value = value || '';
      input.required = !!value && required;
      input.dataset.otherId = id;
      wrap.appendChild(input);
      return wrap;
    }

      config.fields.forEach(fieldConfig => {
        const fieldEl = buildField(fieldConfig, draft);
        form.appendChild(fieldEl);
      });

      config.fields.forEach(fieldConfig => {
        const fieldEl = form.querySelector(`.field[data-field-id="${fieldConfig.id}"]`);
        if (!fieldEl) return;
        finalizeField(fieldEl, fieldConfig, draft);
        setupOtherHandlers(fieldEl, fieldConfig);
      });
      initializeSelectFields(form, config, draft);
      attachConditionalListeners(form, config);

    function initializeSelectFields(form, config, draft) {
      config.fields.forEach(field => {
        if (field.type !== 'select') return;
        const wrapper = form.querySelector(`.field[data-field-id="${field.id}"] .custom-select`);
        if (!wrapper) return;
        updateSelectPlaceholder(wrapper, field);
        const hidden = wrapper.querySelector('input[type="hidden"]');
        hidden.addEventListener('change', () => updateSelectPlaceholder(wrapper, field));
      });
    }

    function setupOtherHandlers(fieldEl, config) {
      if (config.type === 'radio' || config.type === 'radio-conditional') {
        const chips = fieldEl.querySelectorAll('.chip');
        chips.forEach(chip => {
          const input = chip.querySelector('input[type="radio"]');
          const otherWrap = chip.querySelector('.other-input');
          if (otherWrap) {
            const text = otherWrap.querySelector('input');
            const update = () => {
              if (input.checked) {
                otherWrap.hidden = false;
                text.required = true;
                text.name = text.dataset.otherId;
              } else {
                otherWrap.hidden = true;
                text.required = false;
                text.name = '';
                text.value = '';
              }
            };
            update();
            input.addEventListener('change', () => {
              fieldEl.querySelectorAll('.other-input').forEach(other => {
                if (other === otherWrap) return;
                const otherInput = other.querySelector('input');
                other.hidden = true;
                otherInput.required = false;
                otherInput.name = '';
                otherInput.value = '';
              });
              update();
            });
          } else {
            input.addEventListener('change', () => {
              fieldEl.querySelectorAll('.other-input').forEach(other => {
                const otherInput = other.querySelector('input');
                other.hidden = true;
                otherInput.required = false;
                otherInput.name = '';
                otherInput.value = '';
              });
            });
          }
        });
      }
      if (config.type === 'multi' || config.type === 'multi-conditional') {
        fieldEl.querySelectorAll('.chip').forEach(chip => {
          const input = chip.querySelector('input[type="checkbox"]');
          const otherWrap = chip.querySelector('.other-input');
          if (!otherWrap) return;
          const text = otherWrap.querySelector('input');
          const update = () => {
            if (input.checked) {
              otherWrap.hidden = false;
              text.required = true;
              text.name = text.dataset.otherId;
            } else {
              otherWrap.hidden = true;
              text.required = false;
              text.name = '';
              text.value = '';
            }
          };
          update();
          input.addEventListener('change', update);
        });
      }
    }

    function destroyCharts() {
      Object.values(state.charts).forEach(chart => chart.destroy());
      state.charts = {};
    }

    function createKpiCard(label, value) {
      const card = document.createElement('div');
      card.className = 'kpi-card';
      const span = document.createElement('span');
      span.textContent = label;
      const strong = document.createElement('strong');
      strong.textContent = value;
      card.append(span, strong);
      return card;
    }

    function formatAverage(values) {
      const filtered = values.filter(v => !isNaN(v));
      if (!filtered.length) return t('noData');
      const avg = filtered.reduce((a, b) => a + b, 0) / filtered.length;
      return avg.toFixed(1);
    }

    function formatPremium(responses) {
      if (!responses.length) return t('noData');
      const yesValues = new Set(['Yes', i18n.en.yes, i18n.ar.yes]);
      const yesCount = responses.filter(r => yesValues.has(r.premium)).length;
      const percent = responses.length ? Math.round((yesCount / responses.length) * 100) : 0;
      return `${yesCount} (${percent}%)`;
    }

    function createChartCard(key, title, chartConfig) {
      const card = document.createElement('div');
      card.className = 'chart-card';
      const heading = document.createElement('h4');
      heading.textContent = title;
      card.appendChild(heading);
      const canvas = document.createElement('canvas');
      card.appendChild(canvas);
      if (chartConfig) {
        state.charts[key] = new Chart(canvas.getContext('2d'), chartConfig);
      } else {
        const empty = document.createElement('span');
        empty.textContent = t('noData');
        card.appendChild(empty);
      }
      return card;
    }

    function chartBaseOptions({ indexAxis = 'x', type = 'bar' } = {}) {
      const textColor = getComputedStyle(document.body).color;
      const gridColor = state.theme === 'dark' ? 'rgba(230,238,252,0.2)' : 'rgba(18,23,34,0.12)';
      return {
        type,
        options: {
          responsive: true,
          maintainAspectRatio: false,
          locale: state.lang === 'ar' ? 'ar' : 'en',
          scales: type === 'pie' ? {} : {
            x: {
              beginAtZero: true,
              ticks: { color: textColor },
              grid: { color: gridColor },
            },
            y: {
              beginAtZero: true,
              ticks: { color: textColor },
              grid: { color: gridColor },
            }
          },
          plugins: {
            legend: {
              labels: { color: textColor },
              rtl: state.lang === 'ar'
            },
            tooltip: {
              callbacks: {
                label: context => `${context.formattedValue}`
              }
            }
          },
          indexAxis
        }
      };
    }

    function buildVendorOrdersChart(responses) {
      if (!responses.length) return null;
      const buckets = ['5–10', '10–20', '20–40', '40+', 'Other'];
      const counts = { '5–10': 0, '10–20': 0, '20–40': 0, '40+': 0, 'Other': 0 };
      responses.forEach(r => {
        const value = r.orders_profitable;
        if (counts[value] != null) {
          counts[value]++;
        } else {
          counts['Other']++;
        }
      });
      const opts = chartBaseOptions();
      opts.data = {
        labels: buckets,
        datasets: [{
          label: t('qProfitableVolume'),
          data: buckets.map(b => counts[b]),
          backgroundColor: ['#25ADFE', '#A357D7', '#E8635D', '#65C466', '#F0B429']
        }]
      };
      return opts;
    }

    function buildCustomerNpsChart(responses) {
      if (!responses.length) return null;
      const labels = Array.from({ length: 11 }, (_, i) => i);
      const counts = labels.map(() => 0);
      responses.forEach(r => {
        const score = Number(r.nps);
        if (!isNaN(score) && score >= 0 && score <= 10) counts[score]++;
      });
      const opts = chartBaseOptions();
      opts.data = {
        labels,
        datasets: [{
          label: t('qNPS'),
          data: counts,
          backgroundColor: labels.map(() => '#25ADFE')
        }]
      };
      return opts;
    }

    function buildVendorRevenueChart(responses) {
      if (!responses.length) return null;
      const statuses = ['accept_5_10k', 'accept_10_20k', 'accept_20k_plus'];
      const labels = ['Acceptable', 'Neutral', 'Not acceptable'];
      const colors = ['#65C466', '#F0B429', '#E8635D'];
      const dataset = labels.map((statusLabel, idx) => {
        return {
          label: t(`acceptScale.${idx}`),
          data: statuses.map(key => responses.filter(r => (r[key] || '').startsWith(statusLabel)).length),
          backgroundColor: colors[idx]
        };
      });
      const opts = chartBaseOptions();
      opts.data = {
        labels: statuses.map((key, idx) => t(`revBuckets.${idx}`)),
        datasets: dataset
      };
      opts.options.scales.x.stacked = true;
      opts.options.scales.y.stacked = true;
      return opts;
    }

    function buildVendorValueChart(responses) {
      if (!responses.length) return null;
      const options = i18n.en.valueOptions;
      const counts = options.map(() => 0);
      responses.forEach(r => {
        (Array.isArray(r.value_expect) ? r.value_expect : []).forEach(val => {
          const idx = options.indexOf(val);
          if (idx >= 0) counts[idx]++;
        });
      });
      const opts = chartBaseOptions({ indexAxis: 'y' });
      opts.data = {
        labels: options.map((_, idx) => t(`valueOptions.${idx}`)),
        datasets: [{
          label: t('qValueExpect'),
          data: counts,
          backgroundColor: '#25ADFE'
        }]
      };
      return opts;
    }

    function buildPublicBarrierChart(responses) {
      const filtered = responses.filter(r => r.barrier);
      if (!filtered.length) return null;
      const options = i18n.en.whyNotOpts;
      const counts = options.map(() => 0);
      filtered.forEach(r => {
        const idx = options.indexOf(r.barrier);
        if (idx >= 0) counts[idx]++;
      });
      const opts = chartBaseOptions({ type: 'pie' });
      opts.data = {
        labels: options.map((_, idx) => t(`whyNotOpts.${idx}`)),
        datasets: [{
          data: counts,
          backgroundColor: ['#25ADFE', '#A357D7', '#E8635D', '#65C466', '#F0B429']
        }]
      };
      return opts;
    }

    function buildTextBlock(title, entries) {
      const card = document.createElement('div');
      card.className = 'text-block';
      const heading = document.createElement('h4');
      heading.textContent = title;
      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = t('copy');
      const pre = document.createElement('pre');
      pre.textContent = entries.length ? entries.join('\n\n') : t('noEntries');
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(pre.textContent);
          showToast(t('copied'));
        } catch (err) {
          console.error(err);
        }
      });
      card.append(heading, copyBtn, pre);
      return card;
    }

    function compileVendorNotes(responses) {
      const fields = [
        { key: 'category_other', label: t('categoryLabel') },
        { key: 'orders_all_other', label: t('ordersAllLabel') },
        { key: 'orders_profitable_other', label: t('qProfitableVolume') },
        { key: 'min_orders_to_stay_other', label: t('qMinStay') },
        { key: 'accept_5_10k_other', label: t('revBuckets.0') },
        { key: 'accept_10_20k_other', label: t('revBuckets.1') },
        { key: 'accept_20k_plus_other', label: t('revBuckets.2') },
        { key: 'value_expect_other', label: t('qValueExpect') },
        { key: 'leave_reason_other', label: t('qLeaveReason') },
        { key: 'recommend_other', label: t('qRecommend') },
        { key: 'notes', label: t('qNotes') }
      ];
      return flattenEntries(responses, fields);
    }

    function compileCustomerNotes(responses) {
      const fields = [
        { key: 'cats_other', label: t('qCatsUsed') },
        { key: 'freq_other', label: t('qUseFreq') },
        { key: 'time_save_other', label: t('qTimeSave') },
        { key: 'money_save_other', label: t('qMoneySave') },
        { key: 'wants_services', label: t('qAddServices') },
        { key: 'more_other', label: t('qUseMore') },
        { key: 'notes', label: t('qNotes') }
      ];
      return flattenEntries(responses, fields);
    }

    function compilePublicNotes(responses) {
      const fields = [
        { key: 'platforms_other', label: t('qPlatforms') },
        { key: 'barrier_other', label: t('qWhyNot') },
        { key: 'top_factor_other', label: t('qMostFactor') },
        { key: 'first_cat_other', label: t('qFirstCat') },
        { key: 'premium_other', label: t('qPremium') },
        { key: 'why_tamam', label: t('qWhyTamam') }
      ];
      return flattenEntries(responses, fields);
    }

    function flattenEntries(responses, fields) {
      const entries = [];
      responses.forEach((resp, index) => {
        fields.forEach(field => {
          const value = resp[field.key];
          if (Array.isArray(value) && value.length) {
            entries.push(`${field.label}: ${value.join(', ')}`);
          } else if (value && String(value).trim()) {
            entries.push(`${field.label}: ${value}`);
          }
        });
      });
      return entries;
    }

    function exportWorkbook(db, autoDownload = true) {
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(formatSheet(db.vendor, surveyConfigs.vendor.schema)), 'Vendor');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(formatSheet(db.customer, surveyConfigs.customer.schema)), 'Customer');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(formatSheet(db.public, surveyConfigs.public.schema)), 'Public');
      if (autoDownload) {
        XLSX.writeFile(wb, buildFilename());
      }
      return wb;
    }

    function formatSheet(entries, schema) {
      return (entries || []).map(entry => {
        const row = {};
        schema.forEach(key => {
          const value = entry[key];
          if (Array.isArray(value)) {
            row[key] = value.join(', ');
          } else {
            row[key] = value ?? '';
          }
        });
        row.ts_iso = entry.ts ? new Date(entry.ts).toISOString() : '';
        row.seconds = entry.seconds ?? '';
        return row;
      });
    }

    function buildFilename() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const name = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}`;
      return `tamam-survey-export-${name}.xlsx`;
    }

    function backupAndReset() {
      const db = getDB();
      exportWorkbook(db, true);
      saveDB({ vendor: [], customer: [], public: [] });
      ['vendor','customer','public'].forEach(key => {
        clearDraft(key);
        localStorage.removeItem(COMPLETED_PREFIX + key);
      });
      showToast(t('resetDone'));
      renderResults();
    }
