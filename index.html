<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tamam Research Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.19.3/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7fb;
      --bg-gradient: linear-gradient(180deg, rgba(228,235,255,0.9), rgba(241,247,255,0.9));
      --surface: rgba(255,255,255,0.72);
      --surface-dark: rgba(24,24,32,0.72);
      --border: rgba(255,255,255,0.4);
      --text: #10121a;
      --text-muted: rgba(16,18,26,0.65);
      --primary: #5766ff;
      --primary-soft: rgba(87,102,255,0.14);
      --shadow: 0 18px 45px rgba(45,55,85,0.16);
      --radius-lg: 20px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --focus: 0 0 0 3px rgba(87,102,255,0.35);
      --transition: 180ms ease;
      --scrollbar: rgba(87,102,255,0.35);
    }
    [data-theme="dark"] {
      --bg: #0f111b;
      --bg-gradient: linear-gradient(180deg, rgba(18,20,34,0.94), rgba(17,19,32,0.88));
      --surface: rgba(32,36,55,0.65);
      --surface-dark: rgba(18,20,34,0.85);
      --border: rgba(255,255,255,0.08);
      --text: #f7f8fc;
      --text-muted: rgba(247,248,252,0.7);
      --primary: #8a9bff;
      --primary-soft: rgba(138,155,255,0.16);
      --shadow: 0 18px 45px rgba(6,7,12,0.6);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-gradient), var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 320ms ease, color 320ms ease;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(119,130,255,0.28), transparent 55%),
                  radial-gradient(circle at bottom right, rgba(179,120,255,0.22), transparent 45%);
      pointer-events: none;
      z-index: -1;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    img { max-width: 100%; display: block; }

    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: direction var(--transition);
    }
    .app-header {
      padding: 24px clamp(16px, 5vw, 48px) 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-logo {
      width: clamp(32px, 6vw, 40px);
      height: clamp(32px, 6vw, 40px);
      border-radius: 12px;
      background: linear-gradient(135deg, #6d7bff, #b388ff);
      display: grid;
      place-items: center;
      color: white;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.4px;
      box-shadow: 0 12px 24px rgba(98,110,255,0.28);
    }
    .brand-title {
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 600;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .icon-button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--surface);
      color: var(--text);
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 1px var(--border), 0 6px 16px rgba(45,55,85,0.12);
      transition: background var(--transition), transform var(--transition);
    }
    .icon-button:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }
    .icon-button:hover {
      transform: translateY(-1px);
    }
    .lang-toggle {
      min-width: 72px;
      padding: 10px 14px;
      border-radius: 22px;
      border: none;
      background: var(--surface);
      box-shadow: inset 0 0 0 1px var(--border), 0 6px 16px rgba(45,55,85,0.12);
      font-weight: 500;
    }
    .lang-toggle:focus-visible { outline: none; box-shadow: var(--focus); }

    nav {
      padding: 0 clamp(16px, 5vw, 48px) 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .nav-link {
      padding: 10px 16px;
      background: var(--surface);
      border-radius: 999px;
      box-shadow: inset 0 0 0 1px var(--border), 0 8px 16px rgba(45,55,85,0.12);
      font-weight: 500;
      transition: background var(--transition), color var(--transition);
    }
    .nav-link[aria-current="true"] {
      background: var(--primary);
      color: white;
    }

    main {
      flex: 1;
      padding: 0 clamp(16px, 5vw, 48px) 80px;
    }
    .view {
      display: none;
      animation: fadeIn 240ms ease;
    }
    .view.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--surface);
      backdrop-filter: blur(18px);
      border-radius: var(--radius-lg);
      padding: clamp(20px, 3vw, 32px);
      box-shadow: inset 0 0 0 1px var(--border), var(--shadow);
    }
    .card-muted {
      background: var(--surface-dark);
    }
    .section-title {
      font-size: clamp(24px, 3vw, 32px);
      margin-bottom: 12px;
      font-weight: 600;
    }
    .section-subtitle {
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .intro {
      display: grid;
      gap: 16px;
      margin-bottom: 32px;
      max-width: 960px;
    }

    .social-carousel {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .social-card {
      flex: 0 0 280px;
      scroll-snap-align: start;
      border-radius: var(--radius-md);
      position: relative;
      aspect-ratio: 9 / 16;
      background: var(--surface-dark);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .social-card iframe,
    .social-card blockquote {
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
    }
    .social-fallback {
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      color: var(--text);
      gap: 12px;
    }
    .social-fallback svg { width: 32px; height: 32px; }

    .cta-grid {
      margin-top: 32px;
      display: grid;
      gap: 16px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: clamp(20px, 3vw, 32px);
      box-shadow: inset 0 0 0 1px var(--border), var(--shadow);
    }
    .cta-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }
    .store-badge {
      height: 44px;
      width: auto;
      object-fit: contain;
      border-radius: 12px;
    }
    .cta-links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .cta-link {
      padding: 10px 18px;
      background: var(--primary-soft);
      border-radius: 999px;
      font-weight: 500;
      color: var(--primary);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    form {
      display: grid;
      gap: 24px;
    }
    .field-group {
      display: grid;
      gap: 8px;
    }
    .field-label {
      font-weight: 500;
    }
    .field-description { color: var(--text-muted); font-size: 0.95rem; }
    .field-input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(120,130,200,0.25);
      background: rgba(255,255,255,0.65);
      color: inherit;
      transition: border var(--transition), box-shadow var(--transition), background var(--transition);
    }
    [data-theme="dark"] .field-input,
    [data-theme="dark"] select,
    [data-theme="dark"] textarea {
      background: rgba(24,26,40,0.9);
      border: 1px solid rgba(140,150,255,0.3);
    }
    .field-input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: none;
      box-shadow: var(--focus);
      border-color: var(--primary);
    }
    textarea { min-height: 120px; resize: vertical; }
    .options {
      display: grid;
      gap: 10px;
    }
    .option-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.5);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      border: 1px solid rgba(120,130,200,0.22);
      transition: border var(--transition), background var(--transition);
    }
    [data-theme="dark"] .option-item {
      background: rgba(24,26,40,0.7);
      border-color: rgba(140,150,255,0.3);
    }
    .progress-bar {
      height: 10px;
      background: rgba(255,255,255,0.4);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-inner {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #6d7bff, #a78bfa);
      transition: width 200ms ease;
    }
    .sticky-banner {
      position: sticky;
      top: 16px;
      z-index: 5;
      background: linear-gradient(120deg, rgba(106,125,255,0.85), rgba(171,123,255,0.75));
      color: white;
      padding: 16px;
      border-radius: var(--radius-md);
      box-shadow: 0 16px 32px rgba(70,70,120,0.28);
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .btn {
      padding: 12px 20px;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .btn-primary {
      background: linear-gradient(135deg, #6d7bff, #b388ff);
      color: white;
      box-shadow: 0 12px 24px rgba(109,123,255,0.35);
    }
    .btn-primary:focus-visible { outline: none; box-shadow: var(--focus); }
    .btn-primary:hover { transform: translateY(-1px); }

    .toast-container {
      position: fixed;
      top: 16px;
      right: 16px;
      left: auto;
      display: grid;
      gap: 8px;
      z-index: 1000;
    }
    [dir="rtl"] .toast-container {
      right: auto;
      left: 16px;
    }
    .toast {
      background: rgba(25,28,45,0.88);
      color: white;
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(12,14,25,0.45);
      animation: slideIn 220ms ease;
    }
    @keyframes slideIn {
      from { opacity:0; transform: translateY(-10px); }
      to { opacity:1; transform: translateY(0); }
    }

    .thanks {
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
      display: grid;
      gap: 12px;
    }

    .tab-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .tab-btn {
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--surface);
      border: none;
      font-weight: 500;
    }
    .tab-btn.active { background: var(--primary); color: white; }

    .dashboard-grid {
      display: grid;
      gap: 24px;
    }
    .kpi-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }
    .kpi-card {
      padding: 16px;
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.55);
      box-shadow: inset 0 0 0 1px var(--border);
    }
    [data-theme="dark"] .kpi-card {
      background: rgba(24,26,40,0.75);
    }
    .charts-grid {
      display: grid;
      gap: 24px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }
    .open-text {
      display: grid;
      gap: 12px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 0.9rem;
    }
    .copy-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: none;
      background: rgba(255,255,255,0.6);
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(120,130,200,0.2);
    }
    th {
      text-align: left;
      color: var(--text-muted);
      font-weight: 600;
    }
    [dir="rtl"] th, [dir="rtl"] td {
      text-align: right;
    }
    .table-wrapper {
      overflow-x: auto;
      background: rgba(255,255,255,0.55);
      border-radius: var(--radius-md);
      box-shadow: inset 0 0 0 1px var(--border);
    }

    .search-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15,18,28,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1100;
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      background: var(--surface);
      backdrop-filter: blur(18px);
      border-radius: var(--radius-lg);
      padding: 24px;
      max-width: min(640px, 94vw);
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 24px 48px rgba(12,15,35,0.4);
    }
    .modal-close {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
      background: inherit;
    }
    .modal-close button {
      border: none;
      background: rgba(255,255,255,0.4);
      border-radius: 999px;
      padding: 8px 12px;
    }

    .password-gate {
      display: grid;
      gap: 16px;
      max-width: 400px;
      margin: 0 auto;
      text-align: center;
    }

    .export-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .debug-panel {
      position: fixed;
      bottom: 16px;
      right: 16px;
      display: grid;
      gap: 8px;
      z-index: 200;
    }
    [dir="rtl"] .debug-panel {
      right: auto;
      left: 16px;
    }
    .debug-panel button {
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
      background: rgba(0,0,0,0.55);
      color: white;
      font-size: 12px;
    }

    ::-webkit-scrollbar {
      height: 10px;
      width: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar);
      border-radius: 999px;
    }

    @media (max-width: 720px) {
      .app-header { padding: 20px 16px 12px; }
      nav { padding: 0 16px 16px; }
      main { padding: 0 16px 64px; }
      .intro { gap: 12px; }
      .cta-buttons { flex-direction: column; align-items: stretch; }
      .cta-links { justify-content: center; }
      .control-group { gap: 8px; }
      .icon-button { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <header class="app-header">
      <div class="brand-group">
        <img src="https://gettamam.com/wp-content/uploads/2024/07/Tamam-Logo-Icon.svg" alt="Tamam" class="brand-logo" />
        <div class="brand-title" data-i18n="headerTitle">Tamam Research Portal</div>
      </div>
      <div class="control-group">
        <button class="icon-button" id="theme-toggle" aria-label="Toggle theme">🌞</button>
        <button class="lang-toggle" id="lang-toggle" aria-label="Switch language">AR</button>
      </div>
    </header>
    <nav id="nav"></nav>
    <main id="app"></main>
  </div>

  <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="modal-backdrop" aria-modal="true" role="dialog" hidden>
    <div class="modal" role="document">
      <div class="modal-close"><button id="modal-close">Close</button></div>
      <div id="modal-content"></div>
    </div>
  </div>

  <div class="debug-panel" id="debug-panel"></div>

  <script async src="https://www.instagram.com/embed.js"></script>

  const COMMISSION_BANDS = {
    home: '15–20%',
    car: '15–20%',
    health: '25–30%',
    lifestyle: '20–25%'
  };

  const STORAGE_KEYS = {
    db: 'tamam_research_db',
    drafts: {
      vendor: 'draft_vendor',
      customer: 'draft_customer',
      public: 'draft_public'
    },
    completed: {
      vendor: 'completed_vendor',
      customer: 'completed_customer',
      public: 'completed_public'
    },
    theme: 'tmm_theme',
    lang: 'tmm_lang'
  };

  const defaultDB = () => ({ vendor: [], customer: [], public: [] });

  function getDB() {
    try {
      const raw = localStorage.getItem(STORAGE_KEYS.db);
      if (!raw) return defaultDB();
      const parsed = JSON.parse(raw);
      return { vendor: parsed.vendor || [], customer: parsed.customer || [], public: parsed.public || [] };
    } catch (e) {
      logDebug('DB parse failed', e);
      return defaultDB();
    }
  }
  function saveDB(db) {
    localStorage.setItem(STORAGE_KEYS.db, JSON.stringify(db));
  }

  const state = {
    lang: localStorage.getItem(STORAGE_KEYS.lang) || 'en',
    theme: localStorage.getItem(STORAGE_KEYS.theme) || 'light',
    currentRoute: null,
    routes: {},
    timers: {},
    surveys: {
      vendor: { formEl: null, data: {}, start: null },
      customer: { formEl: null, data: {}, start: null },
      public: { formEl: null, data: {}, start: null }
    },
    charts: {},
    chartInstances: {},
    passwordUnlocked: {},
    results: { tab: 'vendor' }
  };

  document.documentElement.setAttribute('lang', state.lang === 'ar' ? 'ar' : 'en');
  document.getElementById('app-shell').setAttribute('dir', state.lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.dataset.theme = state.theme;

  const t = (key, vars = {}) => {
    const str = I18N[state.lang][key] || key;
    return str.replace(/\{(.*?)\}/g, (_, v) => vars[v] ?? '');
  };

  function showToast(message) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(-6px)';
      setTimeout(() => toast.remove(), 220);
    }, 2800);
  }

  function updateNav() {
    const nav = document.getElementById('nav');
    nav.innerHTML = '';
    NAV_ITEMS.forEach(item => {
      const link = document.createElement('a');
      link.href = item.hash;
      link.textContent = t(item.key);
      link.className = 'nav-link';
      if (item.hash === location.hash || (!location.hash && item.hash === '#/surveys')) {
        link.setAttribute('aria-current', 'true');
      }
      nav.appendChild(link);
    });
  }

  function updateHeaderTexts() {
    document.querySelector('[data-i18n="headerTitle"]').textContent = t('headerTitle');
    document.getElementById('theme-toggle').setAttribute('aria-label', state.lang === 'ar' ? 'تبديل النمط' : 'Toggle theme');
    document.getElementById('lang-toggle').setAttribute('aria-label', state.lang === 'ar' ? 'تغيير اللغة' : 'Switch language');
    document.getElementById('lang-toggle').textContent = state.lang === 'en' ? 'AR' : 'EN';
  }

  const routes = {};

  function registerRoute(hash, config) {
    routes[hash] = { init: config.initOnce || (()=>{}), mount: config.mount, unmount: config.unmount || (()=>{}), initialized: false, titleKey: config.titleKey, onLang: config.onLang || (()=>{}) };
  }

  const app = document.getElementById('app');

  function setRoute(hash) {
    const target = routes[hash] || routes['#/surveys'];
    if (state.currentRoute && state.currentRoute !== target) {
      state.currentRoute.unmount();
    }
    if (!target.initialized) {
      target.init();
      target.initialized = true;
    }
    app.innerHTML = '';
    target.mount(app);
    state.currentRoute = target;
    updateNav();
    if (hash === '#/surveys') {
      setTimeout(() => window.instgrm?.Embeds?.process(), 0);
    }
  }

  window.addEventListener('hashchange', () => {
    const hash = location.hash || '#/surveys';
    logDebug('Route change', hash);
    setRoute(hash);
  });

  function ensureHash() {
    if (!location.hash) location.hash = '#/surveys';
    else setRoute(location.hash);
  }

  function formatDate(ts) {
    return new Date(ts).toLocaleString(state.lang === 'ar' ? 'ar-AE' : 'en-AE');
  }

  function startTimer(kind) {
    state.surveys[kind].start = Date.now();
  }
  function stopTimer(kind) {
    const entry = state.surveys[kind];
    if (!entry.start) return 0;
    const elapsed = Math.round((Date.now() - entry.start) / 1000);
    entry.start = null;
    return elapsed;
  }

  function autosave(kind) {
    const entry = state.surveys[kind];
    localStorage.setItem(STORAGE_KEYS.drafts[kind], JSON.stringify(entry.data));
    logDebug('Draft saved', kind, entry.data);
  }

  function restoreDraft(kind) {
    const raw = localStorage.getItem(STORAGE_KEYS.drafts[kind]);
    if (!raw) return;
    try {
      const data = JSON.parse(raw);
      state.surveys[kind].data = data;
      showToast(t('restoredDraft'));
      logDebug('Draft restored', kind, data);
    } catch {}
  }

  function handleCompletion(kind) {
    localStorage.setItem(STORAGE_KEYS.completed[kind], 'true');
  }

  function alreadyCompleted(kind) {
    return localStorage.getItem(STORAGE_KEYS.completed[kind]) === 'true';
  }

  function resetDraft(kind) {
    localStorage.removeItem(STORAGE_KEYS.drafts[kind]);
    state.surveys[kind].data = {};
  }

  function recordSubmission(kind, data) {
    const db = getDB();
    db[kind].push(data);
    saveDB(db);
    document.dispatchEvent(new CustomEvent('tamam:dataUpdated', { detail: { kind } }));
    logDebug('Submit', kind, data);
  }

  function createInput(name, type = 'text', attrs = {}) {
    const input = document.createElement('input');
    input.type = type;
    input.name = name;
    input.className = 'field-input';
    Object.entries(attrs).forEach(([key, value]) => input.setAttribute(key, value));
    if (type === 'number') input.inputMode = 'decimal';
    if (type === 'tel' || type === 'email' || type === 'number') input.dir = 'ltr';
    return input;
  }

  function createOtherInput(fieldKey, placeholderKey) {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'field-input option-other';
    input.placeholder = t(placeholderKey || 'otherPlaceholder');
    input.dataset.fieldKey = fieldKey;
    input.required = true;
    input.dataset.requiredInput = 'true';
    return input;
  }

  function bindFieldValue(input, kind, field) {
    const survey = state.surveys[kind];
    const patchValue = () => {
      const existing = survey.data[field];
      if (existing !== undefined) {
        if (input.type === 'checkbox' && Array.isArray(existing)) {
          input.checked = existing.includes(input.value);
        } else if (input.type === 'radio') {
          input.checked = existing === input.value;
        } else {
          input.value = existing;
        }
      }
    };
    patchValue();
    const handler = () => {
      if (input.type === 'checkbox') {
        const arr = Array.isArray(survey.data[field]) ? survey.data[field] : [];
        if (input.checked) {
          if (!arr.includes(input.value)) arr.push(input.value);
        } else {
          const idx = arr.indexOf(input.value);
          if (idx > -1) arr.splice(idx, 1);
        }
        survey.data[field] = arr;
      } else if (input.type === 'radio') {
        survey.data[field] = input.value;
      } else {
        survey.data[field] = input.value;
      }
      autosave(kind);
      updateProgress(kind);
    };
    input.addEventListener('input', handler);
    input.addEventListener('change', handler);
  }

  function updateProgress(kind) {
    const survey = state.surveys[kind];
    if (!survey.progressEl) return;
    const { total, answered } = computeProgress(survey.formEl);
    survey.progressEl.querySelector('.progress-inner').style.width = `${total ? (answered / total) * 100 : 0}%`;
    survey.progressLabel.textContent = `${t('progressLabel')} · ${t('progressValue', { done: numberLabel(answered), total: numberLabel(total) })}`;
  }

  function computeProgress(form) {
    const requiredElements = Array.from(form.querySelectorAll('[data-required="true"]'));
    let total = 0; let answered = 0;
    requiredElements.forEach(wrapper => {
      if (wrapper.offsetParent === null) return;
      total++;
      const inputs = wrapper.querySelectorAll('input, textarea, select');
      let filled = false;
      inputs.forEach(input => {
        if (input.type === 'radio') {
          const group = form.querySelectorAll(`input[name="${input.name}"]`);
          if (Array.from(group).some(r => r.checked)) filled = true;
        } else if (input.type === 'checkbox') {
          const group = form.querySelectorAll(`input[name="${input.name}"]`);
          if (Array.from(group).some(c => c.checked)) filled = true;
        } else if (input.value?.trim()) {
          filled = true;
        }
      });
      if (filled) answered++;
    });
    return { total, answered };
  }

  function validateForm(form) {
    const requiredWrappers = Array.from(form.querySelectorAll('[data-required="true"]'));
    for (const wrapper of requiredWrappers) {
      if (wrapper.offsetParent === null) continue;
      const inputs = wrapper.querySelectorAll('input, textarea, select');
      let valid = false;
      inputs.forEach(input => {
        if (input.type === 'radio') {
          const group = form.querySelectorAll(`input[name="${input.name}"]`);
          if (Array.from(group).some(r => r.checked)) valid = true;
        } else if (input.type === 'checkbox') {
          const group = form.querySelectorAll(`input[name="${input.name}"]`);
          if (Array.from(group).some(c => c.checked)) valid = true;
        } else if (input.value?.trim()) {
          valid = true;
        }
      });
      if (!valid) {
        const firstInput = wrapper.querySelector('input, textarea, select');
        if (firstInput) firstInput.focus();
        return false;
      }
    }
    return true;
  }

  function createPasswordGate(titleKey, promptKey, correct) {
    const wrapper = document.createElement('div');
    wrapper.className = 'card password-gate';
    const heading = document.createElement('h2');
    heading.className = 'section-title';
    heading.dataset.i18n = titleKey;
    heading.textContent = t(titleKey);
    const paragraph = document.createElement('p');
    paragraph.dataset.i18n = promptKey;
    paragraph.textContent = t(promptKey);
    const form = document.createElement('form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      const value = input.value.trim();
      if (value === correct) {
        wrapper.dispatchEvent(new CustomEvent('password-ok', { bubbles: true }));
        logDebug('Password ok', titleKey);
      } else {
        showToast(t('invalidPassword'));
        logDebug('Password fail', titleKey, value);
      }
    });
    const input = createInput('password');
    input.type = 'password';
    input.placeholder = t('passwordPrompt');
    input.dataset.i18nPlaceholder = 'passwordPrompt';
    input.required = true;
    const submit = document.createElement('button');
    submit.type = 'submit';
    submit.className = 'btn btn-primary';
    submit.dataset.i18n = 'submitPassword';
    submit.textContent = t('submitPassword');
    form.appendChild(input);
    form.appendChild(submit);
    wrapper.appendChild(heading);
    wrapper.appendChild(paragraph);
    wrapper.appendChild(form);
    setTimeout(() => input.focus(), 50);
    return wrapper;
  }

  function createField(config, surveyKind) {
    const wrapper = document.createElement('div');
    if (config.type !== 'note') {
      wrapper.className = 'field-group';
      if (config.required) wrapper.dataset.required = 'true';
      if (config.key) wrapper.dataset.fieldKey = config.key;
    }
    if (config.dependsOn) {
      wrapper.dataset.dependsField = config.dependsOn.field;
      wrapper.dataset.dependsValue = config.dependsOn.value;
    }

    if (config.type === 'note') {
      const note = document.createElement('div');
      note.className = 'field-description';
      note.dataset.i18n = config.noteKey;
      note.textContent = t(config.noteKey);
      wrapper.appendChild(note);
      return wrapper;
    }

    const label = document.createElement('label');
    label.className = 'field-label';
    label.dataset.i18n = config.labelKey;
    label.textContent = t(config.labelKey);
    if (!config.required) {
      const opt = document.createElement('span');
      opt.className = 'pill';
      opt.dataset.i18n = 'optional';
      opt.textContent = t('optional');
      label.appendChild(document.createTextNode(' '));
      label.appendChild(opt);
    }
    wrapper.appendChild(label);

    if (config.type === 'text' || config.type === 'email' || config.type === 'tel' || config.type === 'number') {
      const input = createInput(config.key, config.type);
      bindFieldValue(input, surveyKind, config.key);
      wrapper.appendChild(input);
      return wrapper;
    }

    if (config.type === 'textarea') {
      const area = document.createElement('textarea');
      area.name = config.key;
      area.className = 'field-input';
      area.addEventListener('input', () => {
        state.surveys[surveyKind].data[config.key] = area.value;
        autosave(surveyKind);
        if (config.required) updateProgress(surveyKind);
      });
      const existing = state.surveys[surveyKind].data[config.key];
      if (existing) area.value = existing;
      wrapper.appendChild(area);
      return wrapper;
    }

    if (config.type === 'choice') {
      const list = document.createElement('div');
      list.className = 'options';
      wrapper.appendChild(list);

      const makeOther = (otherKey) => {
        const otherWrap = document.createElement('div');
        otherWrap.className = 'field-group option-other-wrapper';
        otherWrap.style.display = 'none';
        otherWrap.dataset.otherFor = config.key;
        otherWrap.dataset.otherKey = otherKey;
        otherWrap.dataset.required = 'true';
        const otherInput = createOtherInput(otherKey);
        otherInput.addEventListener('input', () => {
          state.surveys[surveyKind].data[otherKey] = otherInput.value;
          autosave(surveyKind);
          updateProgress(surveyKind);
        });
        const existingOther = state.surveys[surveyKind].data[otherKey];
        if (existingOther) otherInput.value = existingOther;
        otherWrap.appendChild(otherInput);
        return otherWrap;
      };

      config.options.forEach(option => {
        const optionItem = document.createElement('label');
        optionItem.className = 'option-item';
        const input = document.createElement('input');
        input.name = config.key;
        const value = option.value;
        input.value = value;
        if (config.mode === 'multi') {
          input.type = 'checkbox';
        } else {
          input.type = 'radio';
        }
        optionItem.appendChild(input);
        const span = document.createElement('span');
        if (option.labelKey) {
          span.dataset.i18n = option.labelKey;
          span.textContent = t(option.labelKey);
        } else if (option.dynamicNumber !== undefined) {
          span.dataset.number = option.dynamicNumber;
          span.textContent = numberLabel(option.dynamicNumber);
        } else if (option.label) {
          span.textContent = option.label;
        }
        optionItem.appendChild(span);
        list.appendChild(optionItem);

        bindFieldValue(input, surveyKind, config.key);

        if (option.otherKey) {
          const otherWrap = makeOther(option.otherKey);
          wrapper.appendChild(otherWrap);
          input.dataset.otherToggle = 'true';
          input.dataset.otherTarget = option.otherKey;
          input.addEventListener('change', () => {
            toggleOtherField(config, surveyKind);
          });
        }
        input.addEventListener('change', () => {
          toggleConditionalFields(surveyKind);
        });
      });

      setTimeout(() => toggleOtherField(config, surveyKind));
      return wrapper;
    }

    return wrapper;
  }

  function numberLabel(num) {
    return state.lang === 'ar' ? num.toLocaleString('ar') : String(num);
  }

  function localizeValue(value) {
    if (typeof value === 'number') return numberLabel(value);
    if (typeof value === 'string' && state.lang === 'ar') {
      return value.replace(/\d/g, d => numberLabel(Number(d)));
    }
    return value;
  }

  function toggleOtherField(config, surveyKind) {
    const survey = state.surveys[surveyKind];
    if (!survey.formEl) return;
    const wrappers = survey.formEl.querySelectorAll(`[data-other-for="${config.key}"]`);
    wrappers.forEach(wrapper => {
      const otherKey = wrapper.dataset.otherKey;
      let shouldShow = false;
      const inputs = survey.formEl.querySelectorAll(`input[name="${config.key}"]`);
      inputs.forEach(input => {
        if (input.dataset.otherToggle === 'true' && input.dataset.otherTarget === otherKey) {
          if ((input.type === 'checkbox' && input.checked) || (input.type === 'radio' && input.checked)) {
            shouldShow = true;
          }
        }
      });
      wrapper.style.display = shouldShow ? 'block' : 'none';
      if (!shouldShow) {
        survey.data[otherKey] = '';
        const input = wrapper.querySelector('input');
        if (input) input.value = '';
      }
    });
    autosave(surveyKind);
    updateProgress(surveyKind);
  }

  function toggleConditionalFields(kind) {
    const survey = state.surveys[kind];
    if (!survey.formEl) return;
    const groups = survey.formEl.querySelectorAll('[data-depends-field]');
    groups.forEach(group => {
      const field = group.dataset.dependsField;
      const value = group.dataset.dependsValue;
      const current = survey.data[field];
      const shouldShow = Array.isArray(current) ? current.includes(value) : current === value;
      group.style.display = shouldShow ? '' : 'none';
      if (!shouldShow) {
        const inputs = group.querySelectorAll('input, textarea, select');
        inputs.forEach(input => {
          if (input.type === 'radio' || input.type === 'checkbox') input.checked = false;
          else input.value = '';
        });
        const fieldKey = group.dataset.fieldKey;
        if (fieldKey) {
          if (Array.isArray(state.surveys[kind].data[fieldKey])) state.surveys[kind].data[fieldKey] = [];
          else state.surveys[kind].data[fieldKey] = '';
        }
      }
    });
    updateProgress(kind);
    autosave(kind);
  }

  function ensureRecordFields(record, fields) {
    fields.forEach(key => {
      if (!(key in record)) {
        record[key] = Array.isArray(record[key]) ? [] : '';
      }

    return record;
  }

      const seconds = stopTimer(kind);
      clearInterval(state.timers[kind]);

  function setupCommissionBanner(form) {

    const updateBanner = () => {
      let selected = 'home';
      categoryInputs.forEach(input => { if (input.checked) selected = input.value; });
      const range = COMMISSION_BANDS[selected] || COMMISSION_BANDS.home;
      banner.textContent = t('vendorBanner', { range });
    };
    updateBanner();
    const categoryField = form.querySelector('[data-sticky-source="commission"]');
    if (categoryField) {
      categoryField.after(banner);

  function updateI18nElement(el) {
    const key = el.dataset.i18n;
    if (!key) return;
    const text = t(key);
    if (el.tagName === 'LABEL') {
      let textNode = Array.from(el.childNodes).find(node => node.nodeType === Node.TEXT_NODE);
      if (!textNode) {
        textNode = document.createTextNode('');
        el.insertBefore(textNode, el.firstChild);
      }
      textNode.textContent = text + (el.querySelector('.pill') ? ' ' : '');
    } else {
      el.textContent = text;
    }
  }

  function getFieldDefinition(kind, field) {
    return SURVEY_CONFIGS[kind]?.fields?.find(f => f.key === field);
  }

  function getOptionLabel(kind, field, value) {
    const def = getFieldDefinition(kind, field);
    if (def && def.type === 'choice') {
      const opt = def.options.find(o => o.value === value);
      if (opt) {
        if (opt.labelKey) return t(opt.labelKey);
        if (opt.label) return opt.label;
      }
    }
    if (value === 'other') return t('other');
    if (value === 'not') return t('notAcceptable');
    return value;
  }

  function getOptionOrder(kind, field) {
    const def = getFieldDefinition(kind, field);
    if (def && def.type === 'choice') {
      return def.options.map(o => o.value);
    }
    return [];
  }

  function aggregateCounts(kind, field, mode, records) {
    const counts = new Map();
    const add = (val) => {
      if (!val) return;
      const key = String(val);
      counts.set(key, (counts.get(key) || 0) + 1);
    };
    records.forEach(rec => {
      const value = rec[field];
      if (mode === 'multi' && Array.isArray(value)) {
        value.forEach(add);
      } else {
        add(value);
      }
    });
    const order = getOptionOrder(kind, field);
    const labels = [];
    const values = [];
    const used = new Set();
    order.forEach(val => {
      if (counts.has(val)) {
        labels.push(getOptionLabel(kind, field, val));
        values.push(counts.get(val));
        used.add(val);
      }
    });
    counts.forEach((count, key) => {
      if (used.has(key)) return;
      labels.push(getOptionLabel(kind, field, key));
      values.push(count);
    });
    return { labels, values };
  }

  function aggregateStacked(kind, chartConfig, records) {
    const segments = chartConfig.choices;
    const datasets = [];
    const labels = chartConfig.fields.map(f => t(f.labelKey));
    segments.forEach(segment => {
      const data = chartConfig.fields.map(f => {
        const value = records.filter(rec => rec[f.field] === segment).length;
        return value;
      });
      let labelKey = segment === 'not' ? 'notAcceptable' : segment;
      datasets.push({
        label: t(labelKey),
        data,
        backgroundColor: segment === 'acceptable' ? 'rgba(108,122,255,0.7)' : segment === 'neutral' ? 'rgba(171,123,255,0.7)' : segment === 'not' ? 'rgba(255,107,129,0.7)' : 'rgba(255,199,135,0.7)'
      });
    });
    return { labels, datasets };
  }

  function renderCharts(kind, records) {
    const wrapper = document.createElement('div');
    wrapper.className = 'charts-grid';
    const charts = RESULTS_MAP[kind].charts;
    state.chartInstances[kind] = state.chartInstances[kind] || {};
    charts.forEach(chartConfig => {
      const card = document.createElement('div');
      card.className = 'card';
      const title = document.createElement('h3');
      title.className = 'section-title';
      title.dataset.i18n = chartConfig.labelKey;
      title.textContent = t(chartConfig.labelKey);
      card.appendChild(title);
      const canvas = document.createElement('canvas');
      canvas.style.height = '260px';
      card.appendChild(canvas);
      wrapper.appendChild(card);
      const ctx = canvas.getContext('2d');
      if (state.chartInstances[kind][chartConfig.id]) {
        state.chartInstances[kind][chartConfig.id].destroy();
        delete state.chartInstances[kind][chartConfig.id];
      }
      if (!records.length) return;
      const options = {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { ticks: { color: getComputedStyle(document.body).color } },
          y: { ticks: { color: getComputedStyle(document.body).color }, beginAtZero: true }
        },
        plugins: {
          legend: { display: chartConfig.type === 'stacked', rtl: state.lang === 'ar', labels: { color: getComputedStyle(document.body).color } },
          tooltip: { rtl: state.lang === 'ar' }
        }
      };
      if (state.lang === 'ar') {
        options.locale = 'ar-AE';
      }
      let data;
      if (chartConfig.type === 'stacked') {
        const agg = aggregateStacked(kind, chartConfig, records);
        data = { labels: agg.labels, datasets: agg.datasets };
        options.scales.y.stacked = true;
        options.scales.x.stacked = true;
      } else {
        const mode = chartConfig.mode === 'multi' ? 'multi' : 'single';
        const agg = aggregateCounts(kind, chartConfig.field, mode, records);
        data = {
          labels: agg.labels,
          datasets: [{
            label: t(chartConfig.labelKey),
            data: agg.values,
            backgroundColor: 'rgba(108,122,255,0.7)',
            borderRadius: 8
          }]
        };
      }
      if (state.chartInstances[kind][chartConfig.id]) {
        state.chartInstances[kind][chartConfig.id].destroy();
      }
      const chart = new Chart(ctx, {
        type: 'bar',
        data,
        options
      });
      state.chartInstances[kind][chartConfig.id] = chart;
    });
    return wrapper;
  }

  function formatValueForTable(kind, key, value) {
    let output = value;
    if (Array.isArray(value)) {
      output = value.map(v => getOptionLabel(kind, key, v)).join(', ');
    } else if (key === 'ts' && value) {
      output = formatDate(value);
    } else if (key === 'seconds' && value !== undefined) {
      output = numberLabel(Number(value));
    } else if (typeof value === 'string' && value.trim() === '') {
      return '';
    }
    if (output === undefined || output === null) return '';
    return localizeValue(output);
  }

  function renderTable(kind, records) {
    const section = document.createElement('div');
    section.className = 'card';
    const header = document.createElement('div');

    controls.appendChild(search);

    const tableWrapper = document.createElement('div');

    RESULTS_MAP[kind].columns.forEach(col => {
      const th = document.createElement('th');
      if (col.labelKey) {
        th.dataset.i18n = col.labelKey;
        th.textContent = t(col.labelKey);
      } else {
        th.textContent = col.label();
      }
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);
    const tbody = document.createElement('tbody');
    table.appendChild(tbody);
    tableWrapper.appendChild(table);
    section.appendChild(tableWrapper);

    const stateTable = { search: '', sort: 'date' };

    function applyFilter() {
      let rows = [...records];
      if (stateTable.search) {
        const term = stateTable.search.toLowerCase();
        rows = rows.filter(rec => RESULTS_MAP[kind].searchFields.some(field => (rec[field] || '').toString().toLowerCase().includes(term)));
      }
      if (stateTable.sort === 'date') {
        rows.sort((a, b) => new Date(b.ts || 0) - new Date(a.ts || 0));
      } else {
        rows.sort((a, b) => (a.name || a.company || '').localeCompare(b.name || b.company || '', state.lang === 'ar' ? 'ar' : 'en'));
      }
      return rows;
    }

    function renderRows() {
      tbody.innerHTML = '';
      const rows = applyFilter();
      if (!rows.length) {
        const emptyRow = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = RESULTS_MAP[kind].columns.length;
        cell.dataset.i18n = 'resultsEmpty';
        cell.textContent = t('resultsEmpty');
        emptyRow.appendChild(cell);
        tbody.appendChild(emptyRow);
        return;
      }
      rows.forEach(rec => {
        const tr = document.createElement('tr');
        RESULTS_MAP[kind].columns.forEach(col => {
          const td = document.createElement('td');
          const raw = rec[col.key];
          td.textContent = formatValueForTable(kind, col.key, raw);
          tr.appendChild(td);
        });
        tr.addEventListener('click', () => {
          const detail = document.createElement('div');
          detail.style.display = 'grid';
          detail.style.gap = '12px';
          RESULTS_MAP[kind].columns.forEach(col => {
            const label = col.labelKey ? t(col.labelKey) : col.label();
            const row = document.createElement('div');
            row.innerHTML = `<strong>${label}</strong><div>${formatValueForTable(kind, col.key, rec[col.key]) || '-'}</div>`;
            detail.appendChild(row);
          });
          const meta = document.createElement('div');
          meta.innerHTML = `<strong>${t('timeSpent')}</strong><div>${t('timerSeconds', { seconds: numberLabel(rec.seconds || 0) })}</div>`;
          detail.appendChild(meta);
          openModal(detail);
        });
        tbody.appendChild(tr);
      });
    }

    search.addEventListener('input', () => {
      stateTable.search = search.value.trim();
      renderRows();
    });
    sortDate.addEventListener('click', () => {
      stateTable.sort = 'date';
      renderRows();
    });
    sortName.addEventListener('click', () => {
      stateTable.sort = 'name';
      renderRows();
    });

    renderRows();
    return section;
  }
  function prepareRecordsForExport(kind) {
    const db = getDB();
    return db[kind].map(rec => {
      const copy = {};
      SURVEY_CONFIGS[kind].recordFields.forEach(key => {
        let value = rec[key];
        if (Array.isArray(value)) value = value.join(', ');
        copy[key] = value ?? '';
      });
      return copy;
    });
  }

  function triggerDownload(filename, blob) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  function exportExcel() {
    const wb = XLSX.utils.book_new();
    ['vendor','customer','public'].forEach(kind => {
      const data = prepareRecordsForExport(kind);
      const sheet = XLSX.utils.json_to_sheet(data);
      XLSX.utils.book_append_sheet(wb, sheet, kind.charAt(0).toUpperCase() + kind.slice(1));
    });
    XLSX.writeFile(wb, 'tamam-research.xlsx');
    showToast(t('exportReady'));
  }

  function exportJSON(download = true) {
    const db = getDB();
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    if (download) {
      triggerDownload('tamam-research.json', blob);
      showToast(t('exportReady'));
    }
    return blob;
  }

  function mergeDB(newData) {
    const db = getDB();
    ['vendor','customer','public'].forEach(kind => {
      if (Array.isArray(newData[kind])) {
        newData[kind].forEach(item => db[kind].push(item));
      }
    });
    saveDB(db);
    document.dispatchEvent(new CustomEvent('tamam:dataUpdated', { detail: { kind: 'all' } }));
  }

  function importJSONFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        mergeDB(data);
        showToast(t('importSuccess'));
        if (state.currentRoute === routes['#/surveys/results']) {
          state.currentRoute.mount(app);
        }
      } catch (e) {
        showToast(t('invalidFile'));
      }
    };
    reader.readAsText(file);
  }

    exportJSON(true);
    setTimeout(() => {
      clearAllStorage();
      if (state.currentRoute === routes['#/surveys/results']) {
        state.currentRoute.mount(app);
      }
    }, 400);

    container.innerHTML = '';
    container.appendChild(renderKPIs(kind, records));
    container.appendChild(renderCharts(kind, records));
    container.appendChild(renderOpenResponses(kind, records));
    container.appendChild(renderTable(kind, records));
    applyI18n(container);
  }
  document.addEventListener('tamam:dataUpdated', () => {
    if (state.currentRoute === routes['#/surveys/results'] && state.passwordUnlocked.results) {
      const view = app.querySelector('.dashboard-grid');
      if (view) renderResultsTab(view, state.results.tab);
    }
  });
  </script>
</body>
</html>
